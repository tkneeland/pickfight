# Thresholds shared by every account. Sourced first; an account conf may override any of them.
HANDOFF_WEEKLY_USED=85        # at or above this weekly % used: stop dispatching, triagemaster role passes on
HANDOFF_HARD_WEEKLY_USED=95   # at or above this weekly %: the triagemaster role passes on even inside the RESET_GRACE_HOURS window
RESET_GRACE_HOURS=24          # within this many hours before the weekly reset, spend the remaining budget instead
DAY_AGENTS=3                  # day mode worker target: run exactly this many while tickets are ready, never more
NIGHT_AGENTS=2                # night mode worker target, same rule (cheapest capable worker model)
FIVE_H_SLOW_USED=70           # 5h window at or above this %: start a worker only when none is running (target 1)
FIVE_H_STOP_USED=90           # 5h window at or above this %: start no worker until the window resets (target 0)
REPO=tkneeland/pickfight
# GitHub logins whose tickets an unattended session (pf-reserve.sh) may work: a ticket is picked only when its
# author and its last editor are both listed; anything else is skipped with a log line (owner, 2026-10-22).
TRUSTED_TICKET_AUTHORS="tkneeland tommykneeland agage-JG schans2"
