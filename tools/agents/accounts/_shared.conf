# Thresholds shared by every account. Sourced first; an account conf may override any of them.
HANDOFF_WEEKLY_USED=85        # at or above this weekly % used: stop dispatching, triagemaster role passes on
HANDOFF_HARD_WEEKLY_USED=95   # at or above this weekly %: the triagemaster role passes on even inside the RESET_GRACE_HOURS window
RESET_GRACE_HOURS=24          # within this many hours before the weekly reset, spend the remaining budget instead
DAY_MIN_AGENTS=3              # day mode: keep at least this many worker agents running
NIGHT_PREFERRED_AGENTS=1-2    # night mode: 3 allowed, prefer this many when cheaper for the same result
REPO=tkneeland/pickfight
