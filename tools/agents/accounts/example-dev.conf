# Example account conf for a developer. Copy to accounts/<github-handle>.conf and edit. Shell-sourceable.
ROLE=dev
AUTO_FILE=0                   # 0 = request tickets manually; set 1 only if the team agrees
TZ=America/Chicago            # set your own timezone
QUIET_START=20                # quiet hours (24h, in TZ): the hive pings you only about p1
QUIET_END=9
MIN_WEEKLY_REMAINING_FOR_TICKETS=0   # without a studio: 100 minus the weekly stop (the hub's weekly stop wins)
SUCCESSION_RANK=2             # stand-in order when the triagemaster runs low
# MAX_WORKERS=3                     # max workers without a studio (the hub's max_workers wins); the machine may tune it lower
# DISPLAY_NAME="Bob"                # optional; shown next to the handle in hive.sh and Discord alerts
# PACE_BURN_HOURS=24              # BURN: within this many hours of the 7d reset, an under-used week is spent (default 24)
# PACE_BURN_MARGIN=5               # ...when the unused weekly % exceeds the time left in the week by more than this (default 5)
