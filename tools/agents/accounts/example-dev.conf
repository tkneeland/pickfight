# Example account conf for a developer. Copy to accounts/<github-handle>.conf and edit. Shell-sourceable.
ROLE=dev
AUTO_FILE=0                   # 0 = request tickets manually; set 1 only if the team agrees
TZ=America/Chicago            # set your own timezone
QUIET_START=20                # quiet hours (24h, in TZ): the hive pings you only about p1
QUIET_END=9
MIN_WEEKLY_REMAINING_FOR_TICKETS=0   # e.g. 50 for a reserve account that gets tickets only while it has more than 50% left
SUCCESSION_RANK=2             # stand-in order when the triagemaster runs low
MAX_WORKERS=3                       # pace governor ceiling (hive-pace.sh, 1-4); the machine tunes it itself in $HIVE_STATE/pace-tuning.conf
# DISPLAY_NAME="Bob"                # optional; shown next to the handle in hive.sh and Discord alerts
