# Example account conf for the triagemaster. Copy to accounts/<github-handle>.conf and edit. Shell-sourceable.
# Files named example-* and _* are never treated as accounts.
ROLE=triagemaster
AUTO_FILE=1                   # 1 = this account's agent may file tickets on its own (always via hive-dupe-check.sh)
TZ=America/New_York           # timezone for quiet hours and every printed time
TZ_LABEL=ET                   # label printed after times in PR bodies (default: date +%Z)
QUIET_START=20                # quiet hours begin (24h, in TZ): the hive pings you only about p1; work is unaffected
QUIET_END=9                   # quiet hours end
MIN_WEEKLY_REMAINING_FOR_TICKETS=0   # never assign tickets when remaining weekly % is at or below this
SUCCESSION_RANK=1             # 1 = triagemaster; 2, 3 ... take over in order (see docs/agents/hive.md)
MAX_WORKERS=3                       # pace governor ceiling (hive-pace.sh, 1-4); the machine tunes it itself in $HIVE_STATE/pace-tuning.conf
# REPO_PATH=$HOME/code/my-repo        # optional; overrides hive.conf for this machine
# INSTALL_CMD=                        # optional; overrides hive.conf for this account
# WATCH_PEERS="bob-dev"               # accounts whose beacon and activity the watchers report; default = every other account conf
# DISPLAY_NAME="Alice"              # optional; shown next to the handle in hive.sh and Discord alerts
