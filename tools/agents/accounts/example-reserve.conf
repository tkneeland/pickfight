# Example account conf for a reserve account: a spare subscription that works only when the regular devs cannot
# (docs/agents/hive.md rule 5). Copy to accounts/<github-handle>.conf and edit. Shell-sourceable.
# On the machine that holds it, run: HIVE_ACCOUNT=<handle> bash tools/agents/hive-reserve.sh --install
ROLE=dev
RESERVE=1
AUTO_FILE=0
TZ=America/New_York
QUIET_START=20                # quiet hours (24h, in TZ): the hive pings you only about p1
QUIET_END=9
MIN_WEEKLY_REMAINING_FOR_TICKETS=50  # weekly stop at 50% used (100 minus this); the hub's weekly stop wins
SUCCESSION_RANK=9             # last in line for the triagemaster role
# MAX_WORKERS=3                     # max workers without a studio (the hub's max_workers wins); the machine may tune it lower
# DISPLAY_NAME="Spare"
# PACE_BURN_HOURS=24              # BURN: within this many hours of the 7d reset, an under-used week is spent (default 24)
# PACE_BURN_MARGIN=5               # ...when the unused weekly % exceeds the time left in the week by more than this (default 5)
