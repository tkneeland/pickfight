# Example account conf for a reserve account: a spare subscription that works only when the regular devs cannot
# (docs/agents/hive.md rule 5). Copy to accounts/<github-handle>.conf and edit. Shell-sourceable.
# On the machine that holds it, run: HIVE_ACCOUNT=<handle> bash tools/agents/hive-reserve.sh --install
ROLE=dev
RESERVE=1
AUTO_FILE=0
TZ=America/New_York
QUIET_START=20                # quiet hours (24h, in TZ): the hive pings you only about p1
QUIET_END=9
MIN_WEEKLY_REMAINING_FOR_TICKETS=50  # take new tickets only while more than 50% of the weekly budget is left
SUCCESSION_RANK=9             # last in line for the triagemaster role
MAX_WORKERS=3                       # pace governor ceiling (hive-pace.sh, 1-4); the machine tunes it itself in $HIVE_STATE/pace-tuning.conf
# DISPLAY_NAME="Spare"
