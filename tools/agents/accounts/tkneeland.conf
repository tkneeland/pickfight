# Account settings for tkneeland (the owner's main account). Shell-sourceable.
ROLE=triagemaster
AUTO_FILE=1                   # 1 = this account's agent may file tickets on its own (always via pf-dupe-check.sh)
TZ=America/New_York           # timezone for day/night and every printed time
TZ_LABEL=ET                   # label printed after times in PR bodies
NIGHT_START=20                # night mode begins at this hour (24h, in TZ)
NIGHT_END=9                   # night mode ends at this hour
MIN_WEEKLY_REMAINING_FOR_TICKETS=0   # never assign tickets when remaining weekly % is at or below this
SUCCESSION_RANK=1             # 1 = triagemaster; 2, 3 take over in order (see docs/agents/autotriage.md)
REPO_PATH=$HOME/Desktop/godotProjects/pickfight   # main checkout (not a worktree)
INSTALL_SCRIPT=$HOME/.claude/pickfight-install-mac.sh        # optional: rebuild the local app after a merge
WATCH_PEERS="agage-JG schans2"        # accounts whose usage beacon and activity the watchers report
