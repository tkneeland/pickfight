# Account settings for tkneeland (the owner's main account). Shell-sourceable.
ROLE=triagemaster
AUTO_FILE=1                   # 1 = this account's agent may file tickets on its own (always via hive-dupe-check.sh)
TZ=America/New_York           # timezone for quiet hours and every printed time
TZ_LABEL=ET                   # label printed after times in PR bodies
QUIET_START=20                # quiet hours begin: pings only for p1 (24h, in TZ)
QUIET_END=9                   # quiet hours end
MIN_WEEKLY_REMAINING_FOR_TICKETS=0   # never assign tickets when remaining weekly % is at or below this
SUCCESSION_RANK=1             # 1 = triagemaster; 2, 3 take over in order (see docs/agents/hive.md)
REPO_PATH=$HOME/Desktop/godotProjects/pickfight   # main checkout (not a worktree)
INSTALL_CMD="bash $HOME/.claude/pickfight-install-mac.sh"        # optional: rebuild the local app after a merge
WATCH_PEERS="agage-JG schans2"        # accounts whose usage beacon and activity the watchers report
