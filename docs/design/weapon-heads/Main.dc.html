<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weapon heads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14161c}
.head{stroke:#15151c;stroke-width:2.2px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.haft{fill:#8b6a45;stroke:#15151c;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.floor{fill:#2a2f3b}
</style>
</helmet>
<div style="width: 1440px; height: 1640px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; gap: 32px; background: #14161c; color: #ECEEF3; font-family: 'Atkinson Hyperlegible', sans-serif;">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 40px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 56px; line-height: 1;">Weapon heads</h1>
      <p style="margin: 0; font-size: 18px; color: #A9B1C2; max-width: 760px;">Each head is one filled silhouette in the holder's colour with an ink edge, so the outline alone has to say what it is. Six heads get redrawn; nine already read and stay.</p>
    </div>
    <div style="display: flex; gap: 20px; font-size: 15px; color: #A9B1C2;">
      <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FF9B3D;"></span>Redraw</span>
      <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 12px; height: 12px; border-radius: 3px; background: #4A5263;"></span>Keep</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;">
    <sc-for list="{{heads}}" as="h" hint-placeholder-count="15">
      <div style="background: #1D212B; border-radius: 14px; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #2A2F3B;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 22px;">{{h.name}}</h2>
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; padding: 4px 9px; border-radius: 999px; color: {{h.badgeInk}}; background: {{h.badgeBg}};">{{h.badge}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 12px; color: #A9B1C2; letter-spacing: 0.06em;">NOW</span>
            <svg width="148" height="112" style="background: #262B36; border-radius: 8px; display: block;">
              <g transform="{{h.tNow}}">
                <polygon class="haft" points="{{h.haft}}"></polygon>
                <polygon class="head" points="{{h.now}}" fill="{{colour}}"></polygon>
                <polygon class="head" points="{{h.nowL}}" fill="{{colour}}"></polygon>
              </g>
            </svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 12px; color: #A9B1C2; letter-spacing: 0.06em;">PROPOSED</span>
            <svg width="148" height="112" style="background: #262B36; border-radius: 8px; display: block;">
              <g transform="{{h.tNow}}">
                <polygon class="haft" points="{{h.haft}}"></polygon>
                <polygon class="head" points="{{h.nu}}" fill="{{colour}}"></polygon>
                <polygon class="head" points="{{h.nuL}}" fill="{{colour}}"></polygon>
              </g>
            </svg>
          </div>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #C9CFDB;">{{h.note}}</p>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 22px;">Proposed, at 2× game size</h2>
    <div style="background: #1D212B; border: 1px solid #2A2F3B; border-radius: 14px; padding: 24px 28px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 22px 30px;">
      <sc-for list="{{heads}}" as="h" hint-placeholder-count="15">
        <svg width="{{h.gw}}" height="{{h.gh}}" style="display: block;">
          <g transform="{{h.tGame}}">
            <polygon class="haft" points="{{h.haft}}"></polygon>
            <polygon class="head" points="{{h.nu}}" fill="{{colour}}"></polygon>
            <polygon class="head" points="{{h.nuL}}" fill="{{colour}}"></polygon>
          </g>
        </svg>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"colour":{"editor":"color","default":"#FFD933","options":["#FFD933","#59BFFF","#FF6B6B","#7CE38B"]},"$preview":{"width":1440,"height":1640}}'>

      {id:"dagger",name:"Dagger",changed:false,vb:"-16 -6.4 32 12.8",now:"-9.4,-1.3 -5.5,-2.4 9.9,-1.7 12,0 9.9,1.7 -5.5,2.4 -9.4,1.3",nowL:"",note:"Reads clearly already."},

      {id:"boomstick",name:"Boomstick",changed:false,vb:"-28 -10 104 20",now:"-24,-6 -8,-4.5 -4,-3.2 62,-3.2 62,-4.5 72,-4.5 72,4.5 62,4.5 62,3.2 -4,3.2 -8,4.5 -24,6",nowL:"",note:"Reads clearly already."},

      {id:"umbrella",name:"Umbrella",changed:true,vb:"-16 -17 36.5 34",now:"-2,-4 1,-11 11,-11 11,11 1,11 -2,4",nowL:"",nu:"-2,-1 3.5,-1 2,-4.3 4.6,-8.6 2,-13 4.8,-12.6 7.5,-11.3 9.8,-9.2 11.5,-6.5 12.6,-3.4 13,-1.2 16.5,0 13,1.2 12.6,3.4 11.5,6.5 9.8,9.2 7.5,11.3 4.8,12.6 2,13 4.6,8.6 2,4.3 3.5,1 -2,1",nuL:"",note:"Domed canopy facing out, scalloped rim and a tip spike. Today it is a wedge."},
      {id:"magnet",name:"Magnet",changed:true,vb:"-16 -13 36 26",now:"-8,-8 8,-8 8,8 -8,8",nowL:"",nu:"6,-9 16,-9 16,-4 6,-4 4.5,-3.7 3.2,-2.8 2.3,-1.5 2,0 2.3,1.5 3.2,2.8 4.5,3.7 6,4 16,4 16,9 6,9 3.2,8.6 0.7,7.3 -1.3,5.3 -2.6,2.8 -3,0 -2.6,-2.8 -1.3,-5.3 0.7,-7.3 3.2,-8.6",nuL:"",note:"A horseshoe opening outward, the magnet everyone knows. Today it is a square."},
      {id:"grapple",name:"Grapple",changed:true,vb:"-16 -14.6 40 29.2",now:"-6,-4 6,-4 8,-2.5 8,2.5 6,4 -6,4",nowL:"7,-1.2 13,-1.2 11,-5 19,0 11,5 13,1.2 7,1.2",nu:"-6,-3 5,-3 8,-5 9,-5 9,0 9,5 8,5 5,3 -6,3",nuL:"6,-1.4 12,-1.4 9,-6 5,-8.5 5.6,-10.6 10.5,-9.4 14.5,-5 16.5,-1.4 20,0 16.5,1.4 14.5,5 10.5,9.4 5.6,10.6 5,8.5 9,6 12,1.4 6,1.4",note:"A barrel with a flared muzzle. The loaded hook becomes a three-tine grapnel."},
      {id:"fishing_rod",name:"Fishing rod",changed:true,vb:"-16 -8 38 21",now:"-5,-3 5,-3 7,-2 7,2 5,3.5 -5,3.5",nowL:"6,-0.8 12,-0.8 10,-4 18,0 10,4 12,0.8 6,0.8",nu:"-6,-1.2 8,-1.2 10,-2.4 11.5,-1.2 11.5,1.2 10,2.4 8,1.2 2,1.2 2.4,1.8 3.2,3.2 3.4,4.9 3,6.5 2,7.8 0.6,8.7 -1,9 -2.6,8.7 -4,7.8 -5,6.5 -5.4,4.9 -5.2,3.2 -4.4,1.8 -6,1.2",nuL:"6,-0.7 16,-0.7 16,4 15.7,5.3 15,6.5 13.8,7.2 12.5,7.5 11.2,7.2 10,6.5 9.3,5.3 9,4 9,1.2 10.4,2.6 10.4,4 10.7,5.1 11.5,5.8 12.5,6.1 13.6,5.8 14.3,5.1 14.6,4 14.6,0.7 6,0.7",note:"A rod tip with a reel and an eyelet. The loaded hook becomes a barbed J."},
      {id:"flail",name:"Flail",changed:false,vb:"-16 -13.5 29.5 27",now:"6,2.5 2.5,6 -2.5,6 -6,2.5 -6,-2.5 -2.5,-6 2.5,-6 6,-2.5",nowL:"",nu:"9.5,0 5.5,2.3 6.7,6.7 2.3,5.5 0,9.5 -2.3,5.5 -6.7,6.7 -5.5,2.3 -9.5,0 -5.5,-2.3 -6.7,-6.7 -2.3,-5.5 0,-9.5 2.3,-5.5 6.7,-6.7 5.5,-2.3",nuL:"",note:"Already spiky: the spiked ball is the swinging part. Unchanged."},
      {id:"boomerang",name:"Boomerang",changed:false,vb:"-16 -16 28.5 32",now:"4.6,1.9 1.9,4.6 -1.9,4.6 -4.6,1.9 -4.6,-1.9 -1.9,-4.6 1.9,-4.6 4.6,-1.9",nowL:"-3,-12 1,-12 8,0 1,12 -3,12 3,0",nu:"-2,-1.6 3,-1.6 6,-5 8.5,-5.5 6,-1 7,0 6,1 8.5,5.5 6,5 3,1.6 -2,1.6",nuL:"0,-11.3 2.7,-9.7 4.9,-7.6 6.6,-5.3 7.7,-2.7 8,0 7.7,2.7 6.6,5.3 4.9,7.6 2.7,9.7 0,11.3 -1,11.6 -0.8,7 1,5.9 2.5,4.6 3.6,3.2 4.3,1.6 4.5,0 4.3,-1.6 3.6,-3.2 2.5,-4.6 1,-5.9 -0.8,-7 -1,-11.6",note:"Reads clearly already."},
      {id:"pogo",name:"Pogo",changed:true,vb:"-16 -11 37 22",now:"-2,4.5 8,4.5 12,2.5 12.5,0 12,-2.5 8,-4.5 -2,-4.5",nowL:"",nu:"-4,-1.4 0,-1.4 0,-7 2.5,-7 2.5,-2.5 3.6,-4.4 4.7,-2.6 5.8,-4.4 6.9,-2.6 8,-4.4 9.1,-2.6 10.2,-4.4 11.3,-2.6 12.6,-2.6 12.6,-3.6 15,-3.6 16.6,-1.6 17,0 16.6,1.6 15,3.6 12.6,3.6 12.6,2.6 11.3,2.6 10.2,4.4 9.1,2.6 8,4.4 6.9,2.6 5.8,4.4 4.7,2.6 3.6,4.4 2.5,2.5 2.5,7 0,7 0,1.4 -4,1.4",nuL:"",note:"Foot pegs, a coil spring and a rubber foot. Today it is a rounded bar."}
    ];
    const order = ["staff","umbrella","magnet","grapple","fishing_rod","pogo","pickaxe","flail","boomerang","sword","axe","dagger","spear","boomstick","shield"];
    const fit = (vb, w, h, pad) => {
      const [x, y, vw, vh] = vb.split(" ").map(Number);
      const s = Math.min((w - pad * 2) / vw, (h - pad * 2) / vh);
      const tx = (w - vw * s) / 2 - x * s, ty = (h - vh * s) / 2 - y * s;
      return "translate(" + tx.toFixed(1) + " " + ty.toFixed(1) + ") scale(" + s.toFixed(3) + ")";
    };
    const heads = order.map((id) => H.find((h) => h.id === id)).map((h) => {
      const [x, y, vw, vh] = h.vb.split(" ").map(Number);
      return {
        ...h,
        nu: h.changed ? h.nu : h.now,
        nuL: h.changed ? h.nuL : h.nowL,
        badge: h.changed ? "REDRAW" : "KEEP",
        badgeBg: h.changed ? "#FF9B3D" : "#4A5263",
        badgeInk: h.changed ? "#1A1206" : "#ECEEF3",
        haft: x + ",-1.4 0,-1.4 0,1.4 " + x + ",1.4",
        tNow: fit(h.vb, 148, 112, 10),
        gw: Math.round(vw * 2), gh: Math.round(vh * 2),
        tGame: "translate(" + (-x * 2) + " " + (-y * 2) + ") scale(2)"
      };

    return { heads, colour: this.props.colour ?? "#FFD933" };

</script>
</body>
</html>
