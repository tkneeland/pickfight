# hive.conf: every project-specific setting for claude-hive (AT mode). Shell-sourceable. Lives at the repo root and is
# committed, so it never holds a secret: the channel topic (msg.conf), the Discord bot token and Discord user ids
# (discord.conf) live in the per-account state dir ~/.claude/hive/<project>/<account>/ on each machine.
# Per-account settings are in tools/agents/accounts/<handle>.conf; shared thresholds in accounts/_shared.conf.

# --- Required ---------------------------------------------------------------------------------------------
REPO=tkneeland/pickfight                   # GitHub slug, owner/name (optional with TRACKER=local; each REPO_PATHS checkout's origin is used)
DECISIONS_ISSUE=685                # issue number where owner decisions accumulate; the morning digest reads it

# --- Project --------------------------------------------------------------------------------------------
PROJECT_NAME="Pickfight"        # human name shown in hive.sh status and Discord text; empty = the repo name
OWNER="tkneeland"                        # GitHub handle of the project owner (decisions, hive.sh); empty = the rank-1 account
HIVE_TZ="America/New_York"                      # timezone for hive-wide times (hive.sh, hive-ask.sh); empty = this account's TZ

# --- Optional ---------------------------------------------------------------------------------------------
REPO_PATH=""                    # main checkout (not a worktree); empty = the checkout these scripts live in
MAIN_BRANCH=main
MERGE_METHOD=merge              # merge | squash | rebase
HOT_FILES="scripts/RoundManager.gd scenes/Main.tscn scripts/Player.gd scripts/ControllerServer.gd CONTEXT.md"                    # space-separated hot shared files; editing one (not appending) makes a ticket conflict-risk
TEST_CMD=""                     # full test suite; run by hive-ship.sh before it pushes. Empty = skip
BOOT_CHECK_CMD=""               # fresh-clone boot check. Runs inside a throwaway clone of the committed branch
                                # ($FRESH_CLONE is its path). Non-zero exit = failed. Empty = skip
INSTALL_CMD=""                  # run in REPO_PATH after each merge to the main branch (e.g. rebuild a local app). Empty = skip
CONFLICT_RESOLVER_CMD="bash tools/game/pf-conflict-resolve.sh"   # Pickfight's merge fixers (old pf-ship.sh)
PRE_PUSH_CMD="bash tools/game/pf-cjk-refresh.sh"                 # game hook run by hive-ship.sh in the worktree before the tests; changes are committed
POST_PR_CMD=""                  # game hook run once the PR exists ($HIVE_PR = its number); changes are committed and pushed
FEATURE_DOC="docs/FEATURES.md"                  # optional doc a player-facing or user-facing PR must update (e.g. docs/FEATURES.md)
FEATURE_PATHS='^(scripts|controller)/'                # regex of paths that require FEATURE_DOC to change (e.g. '^(src|app)/'); empty = no check
DUPE_PATHS="scripts controller scenes"                   # space-separated paths hive-dupe-check.sh searches; empty = the whole repo
META_TICKETS="702 720 619"                 # space-separated issue numbers that never count as a peer's dev queue
GRILL_DOC=""                    # where settled grill answers are appended (e.g. docs/grill-decisions.md); empty = no grill log
DESIGN_DOC=""                   # the game's design doc, read before grilling (e.g. docs/design.md); empty = none
REQUIRE_REVIEW_PASS=1           # 1 = hive-ship.sh / hive-automerge.sh merge only PRs marked review-passed (rule 12)
TRUSTED_TICKET_AUTHORS="tkneeland tommykneeland agage-JG schans2" # GitHub handles whose tickets a RESERVE account's unattended session may work (hive-reserve.sh)

# --- Discord bot (optional; docs/agents/hive.md rules 18, 20, 21) -------------------------------------------
# DISCORD=1 turns on the project bot: the triagemaster watches a public bug/change-request channel and a private dev
# channel (hive-discord-bugs.sh), and the other accounts take over unanswered dev messages (hive-failover.sh). Each
# machine that runs it needs HIVE_DISCORD_TOKEN=<bot token> in $HIVE_STATE/discord.conf (never in this file).
# Never used in PRIVATE mode. The ids below are not secret (anyone in the server can see them).
DISCORD=1
DISCORD_GUILD=1569873613526405190 # server id
DISCORD_BUGS_CHANNEL=1569876514017779794 # public channel id where people report bugs and change requests
DISCORD_DEV_CHANNEL=1569919897591611552 # private dev channel id (dev reports are pre-approved; failover watches it)
DISCORD_BUGS_NAME=change-requests   # display names used in wake lines and status
DISCORD_DEV_NAME=hive
DISCORD_DEV_ROLE=Dev            # role whose check-mark reaction approves a public report and who sees the private channel

# --- Tracker, privacy, scope (see "Private client mode" in docs/agents/hive.md) --------------------
TRACKER=github                  # github = GitHub Issues + labels | local = TRACKER_DIR/<feature>/issues/NN-slug.md with a Status: line
TRACKER_DIR=             # local only; relative to this file's dir
PRIVATE=0                    # 1 = no AT footprint on GitHub: no beacon/decision issues, labels or comments, plain PR bodies,
                                # only this account's PRs are merged. Implies SINGLE_ACCOUNT=1
SINGLE_ACCOUNT=0             # 1 = one account: no beacon, succession or peers
PROJECT=""                      # state-dir name when REPO is empty (default: this dir's name)
REPO_PATHS=""           # space-separated checkouts AT ships to (relative to this dir is fine); empty = REPO_PATH
SCOPE_FILTER=""                 # ERE; only tickets whose file/body matches are AT work, e.g. '^Contract: Contract 2([^.0-9]|$)'
WATCH_HOOKS=""                  # ";"-separated zero-token commands hive-triage-watch.sh runs each poll; first stdout line = wake line
STATUS_HOOK=""                  # local tracker: command whose first stdout line is appended to status line 2 (e.g. build freshness)
WATCH_INTERVAL=600              # watcher poll, seconds
REQUIRE_CI=1                    # 0 = a PR with no CI checks counts as green
CLOSEOUT_STATUS=ready-for-human # status hive-atlas.sh closeout moves a ticket to

# --- The old pf-* hive ---
# Its per-account state dirs, relative to $HOME: "<handle>=<dir>" rules, then the dir of every other handle. On each
# machine, the first hive script run copies the known files from there into ~/.claude/hive/<repo>/<handle>/ (hive-env.sh).
# Delete this block once every machine has run the hive.
LEGACY_STATE="tkneeland=.claude .claude/pf/{handle}"
