# Builds the PC releases (Windows, macOS, Linux) and pushes them to itch.io (#242).
# Unsigned builds; one build serves both host and client.
# Push needs the secret BUTLER_API_KEY and the variable ITCH_TARGET (user/game).
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  GODOT_VERSION: 4.6.2-stable
  GODOT_DIR: /home/runner/godot-bin

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Cache export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable"
          mkdir -p "$dir"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$dir/"

      - name: Install GodotSteam (#428)
        run: bash tools/fetch_godotsteam.sh

      - name: Install Sentry Godot SDK (#681)
        run: bash tools/fetch_sentry.sh

      - name: Stamp the build version (#681)
        run: perl -pi -e 's|^config/icon=|config/version="$ENV{GITHUB_REF_NAME}"\nconfig/icon=|' project.godot

      - name: Import project
        run: '"$GODOT_DIR/godot" --headless --path . --import'

      - name: Delete the global class cache (#1113)
        run: |
          # `--import` wrote .godot/global_script_class_cache.cfg, which resolves
          # `class_name` references a fresh clone cannot. Delete it so the boot
          # check below fails as a fresh clone would (CLAUDE.md, #21, #195).
          rm -f .godot/global_script_class_cache.cfg
          if [ -e .godot/global_script_class_cache.cfg ]; then
            echo "::error::could not delete the global class cache"; exit 1
          fi

      - name: Boot check (#1113)
        run: |
          # Godot exits 0 even on a broken build, so fail on the output (#21).
          "$GODOT_DIR/godot" --headless --path . --quit > boot.log 2>&1 || true
          cat boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' boot.log | grep -v 'Could not create child process'; then
            echo "::error::boot check found script errors; not exporting"
            exit 1
          fi

      - name: Export builds
        run: |
          mkdir -p build/windows build/macos build/linux dist
          "$GODOT_DIR/godot" --headless --path . --export-release "Windows" build/windows/Pickfight.exe
          "$GODOT_DIR/godot" --headless --path . --export-release "macOS" build/macos/Pickfight.zip
          "$GODOT_DIR/godot" --headless --path . --export-release "Linux" build/linux/pickfight.x86_64
          chmod +x build/linux/pickfight.x86_64
          (cd build/windows && zip -qr ../../dist/pickfight-windows.zip .)
          (cd build/macos && zip -qr ../../dist/pickfight-mac.zip .)
          (cd build/linux && zip -qr ../../dist/pickfight-linux.zip .)
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pickfight-builds
          path: dist/*.zip

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "BUTLER_API_KEY secret or ITCH_TARGET variable not set; skipping itch push."
            exit 0
          fi
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          version="${GITHUB_REF_NAME}"
          /tmp/butler/butler push dist/pickfight-windows.zip "$ITCH_TARGET:windows" --userversion "$version"
          /tmp/butler/butler push dist/pickfight-mac.zip "$ITCH_TARGET:mac" --userversion "$version"
          /tmp/butler/butler push dist/pickfight-linux.zip "$ITCH_TARGET:linux" --userversion "$version"

  steam:
    # Uploads the export to Steam's non-default `beta` branch (#722). Never sets a
    # build live; promote by hand in Steamworks. Skips when secrets/vars are unset.
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Steam (beta branch)
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          STEAM_DEPOT_WIN: ${{ vars.STEAM_DEPOT_WIN }}
          STEAM_DEPOT_MAC: ${{ vars.STEAM_DEPOT_MAC }}
          STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
        run: |
          for v in STEAM_USERNAME STEAM_CONFIG_VDF STEAM_APP_ID STEAM_DEPOT_WIN STEAM_DEPOT_MAC STEAM_DEPOT_LINUX; do
            if [ -z "${!v}" ]; then
              echo "$v is not set; skipping Steam upload."
              echo "SKIP_STEAM=1" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "STEAM_READY=1" >> "$GITHUB_ENV"

      - name: Download export artifacts
        if: env.STEAM_READY == '1'
        uses: actions/download-artifact@v4
        with:
          name: pickfight-builds
          path: dist

      - name: Prepare depot content and build files
        if: env.STEAM_READY == '1'
        env:
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          STEAM_DEPOT_WIN: ${{ vars.STEAM_DEPOT_WIN }}
          STEAM_DEPOT_MAC: ${{ vars.STEAM_DEPOT_MAC }}
          STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
        run: |
          set -euo pipefail
          root="$PWD/steam/content"
          mkdir -p "$root/windows" "$root/macos" "$root/linux" steam/out steam/logs
          unzip -q dist/pickfight-windows.zip -d "$root/windows"
          unzip -q dist/pickfight-mac.zip -d "$root/macos"
          unzip -q dist/pickfight-linux.zip -d "$root/linux"
          # The macOS export is itself a zip holding the .app bundle.
          unzip -q "$root/macos/Pickfight.zip" -d "$root/macos"
          rm "$root/macos/Pickfight.zip"
          chmod +x "$root/linux/pickfight.x86_64"
          export STEAM_CONTENT_ROOT=/work/steam/content
          export STEAM_BUILD_OUTPUT=/work/steam/logs
          export STEAM_BUILD_DESC="${GITHUB_REF_NAME}"
          export STEAM_SET_LIVE=beta
          for t in steam/*.vdf.template; do
            envsubst < "$t" > "steam/out/$(basename "${t%.template}")"
          done

      - name: Run steamcmd
        if: env.STEAM_READY == '1'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/steam-config"
          echo "$STEAM_CONFIG_VDF" | base64 -d > "$HOME/steam-config/config.vdf"
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/steam-config:/root/Steam/config" \
            steamcmd/steamcmd@sha256:287aca1c8792a720c6857aabdc3690c1a66acf979fe0d91d85befe1582877078 \
            +login "$STEAM_USERNAME" \
            +run_app_build /work/steam/out/app_build.vdf \
            +quit
          rm -f "$HOME/steam-config/config.vdf"
