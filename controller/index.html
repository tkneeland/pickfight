<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pickfight Controller</title>
<style>
  /* #576: the #507 type, embedded because the host serves this page over the
     LAN with no internet guarantee. Latin subsets of the OFL fonts in
     art/fonts/ (Lilita One for headings and buttons, Nunito 600-900 for body). */
  @font-face {
    font-family: "Lilita One";
    font-weight: 400;
    font-display: swap;
    src: url(fonts/LilitaOne-Latin.woff2) format("woff2");
  }
  @font-face {
    font-family: "Nunito";
    font-weight: 600 900;
    font-display: swap;
    src: url(fonts/Nunito-Latin.woff2) format("woff2");
  }
  :root {
    --ground: #232A4A;
    --cream: #FBF6EA;
    --ink: #14181d;
    --yellow: #F5E24A;
    --muted: #C9CCE0;
    --dim: #5A628C;
    --stripes: repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0 28px, transparent 28px 56px);
    --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  html, body {
    height: 100%;
    margin: 0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    background: var(--ground);
    color: var(--cream);
    font: 800 16px/1.3 "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #pad {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Issue #194: stacked above the lobby card (which covers the pad whenever
     no round is being played) so the player sees its own badge and name there
     and can tap the name to rename. pointer-events: none leaves the name the
     only part that takes a touch. Below the gear (5), the host menu (8) and
     the name and look cards (10). */
  #hud {
    position: fixed;
    z-index: 4;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    padding: 12px 16px;
    pointer-events: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  #slot {
    font-size: 15vmin;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #59606e;
  }
  /* Issue #231: pinned to the top of the HUD, not to the badge's baseline,
     which put it right across the gear on a 375-430 px phone. */
  #status {
    align-self: flex-start;
    font-size: 14px;
    line-height: 18px;
    opacity: 0.7;
  }
  /* Nickname (issue #121): tap to edit. The only part of the HUD that takes
     touches -- except while this player is in play (issue #164), when a
     touch on it goes to the pad like anywhere else. */
  #who { display: flex; flex-direction: column; }
  #name {
    pointer-events: auto;
    font-size: 22px;
    font-weight: 700;
    color: #59606e;
    text-decoration: underline dotted;
    text-underline-offset: 4px;
  }
  #name.locked { pointer-events: none; text-decoration: none; }
  /* Lifetime stats (issue #503): one quiet line under the name card, only
     outside a round; a tap opens the six stats, another closes them. */
  #career { display: none; pointer-events: auto; white-space: pre-line; cursor: pointer; font-size: 14px; line-height: 20px; margin-top: 2px; color: var(--muted); font-weight: 800; }
  #career.show { display: block; }
  #career.open { color: var(--cream); }
  /* Where this player stands right now (issue #121): waiting, eliminated,
     next round in... Hidden while it is simply playing. */
  #state {
    position: fixed;
    left: 0;
    right: 0;
    top: 40%;
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    pointer-events: none;
    opacity: 0.9;
    white-space: pre-line;
  }
  /* Issue #244: the laptop-mouse affordance, only ever shown for a fine
     pointer (a desktop browser) while this player is in play. */
  #mouse-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
    z-index: 3;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #mouse-panel.show { display: flex; }
  #mouse-capture {
    font: inherit;
    font-size: 20px;
    font-weight: 800;
    padding: 14px 26px;
    border: 0;
    border-radius: 14px;
    color: var(--ink);
    background: var(--yellow);
  }
  #reach-row { font-size: 16px; display: flex; align-items: center; gap: 10px; }
  #mouse-sens-row { font-size: 14px; opacity: 0.85; display: flex; align-items: center; gap: 10px; }
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    text-align: center;
    font-size: 14px;
    opacity: 0.5;
    pointer-events: none;
  }
  /* The buzz flash (issue #34, ADR-0013): a full-screen wash in the slot's
     colour, faded out by buzz(). Behind the HUD, never in the way of a touch. */
  #flash {
    position: fixed;
    inset: 0;
    opacity: 0;
    pointer-events: none;
  }
  /* Damage bar (issue #331): a thin strip along the very top, the player's
     colour filling toward red as they near a KO. Never takes a touch. */
  #dmgbar {
    position: fixed;
    z-index: 3;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    pointer-events: none;
  }
  #dmgfill {
    height: 100%;
    width: 0;
    transition: width 0.1s linear;
  }
  /* Stock lives (issue #354): "♥ N" beside the damage bar, and the Steal a
     life button on an eliminated Teams player's phone. */
  #lives {
    position: fixed;
    z-index: 3;
    top: 8px;
    right: 10px;
    display: none;
    color: #ff5a6a;
    font: 700 20px sans-serif;
    pointer-events: none;
  }
  #menu-stock-lives[hidden], #menu-stock-time[hidden] { display: none !important; }
  /* Issue #647: the host's Stages & Rules page, one tab per mode. Names only. */
  #menu-rules { width: 100%; max-width: 560px; }
  #menu-rules > * { width: 100%; }
  #rules-tabs, #rules-stages { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  #rules-switches { display: flex; flex-direction: column; gap: 8px; }
  #rules-all { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  #host-menu #menu-rules button { padding: 10px 6px; font-size: 16px; }
  #host-menu #menu-rules button.on { color: var(--ink); background: var(--yellow); }
  #host-menu #menu-rules button.locked { opacity: 0.35; }
  .rules-heading { font-size: 18px; font-weight: 800; text-align: left; margin-top: 6px; }
  #rules-footer, #rules-summary { font-size: 16px; font-weight: 700; }
  #rules-summary:empty { display: none; }
  #lives.show { display: block; }
  /* King of the Hill (#662): "Hill N / 15 s", the player's own hold time. */
  #hill {
    position: fixed;
    z-index: 3;
    top: 8px;
    left: 10px;
    display: none;
    color: #ffd733;
    font: 700 20px sans-serif;
    pointer-events: none;
  }
  #hill.show { display: block; }
  /* Round modifier chip (#908): the active modifier's title under the damage bar. */
  #modchip {
    position: fixed;
    z-index: 3;
    top: 34px;
    left: 10px;
    display: none;
    max-width: 60vw;
    color: #ffffff;
    background: rgba(20, 24, 29, 0.7);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 1px 8px;
    font: 700 16px sans-serif;
    pointer-events: none;
  }
  #modchip.show { display: block; }
  /* Weak connection (#777): a small non-blocking chip on the right, under the
     Stock lives count (top right) and the gear (44px tall at +44px), so it
     covers neither; the hill and modifier chips sit on the left. */
  #weak-chip {
    position: fixed;
    z-index: 3;
    top: calc(env(safe-area-inset-top, 0px) + 96px);
    right: 10px;
    display: none;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(255, 140, 0, 0.9);
    color: #1a1a1a;
    font: 700 14px sans-serif;
    pointer-events: none;
  }
  #weak-chip.show { display: block; }
  #steal {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: none;
    padding: 14px 22px;
    font: 700 20px sans-serif;
  }
  #steal.show { display: block; }
  /* Lobby, countdown and victory (issue #120): covers the pad whenever no
     match is being played, so its buttons get the touches instead. */
  #lobby {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 20px;
    padding: 24px;
    /* Issue #194: clear of the HUD (badge + name) now drawn on top of it. */
    padding-top: calc(env(safe-area-inset-top, 0px) + 15vmin + 88px);
    background: rgba(35, 42, 74, 0.97);
    text-align: center;
  }
  #lobby.show { display: flex; }
  /* Issue #164: every full-screen card scrolls when it is taller than the
     screen (a small phone, landscape). Centred by two growing spacers rather
     than justify-content: center, which pushes an overflowing card's top out
     of reach above the scroll area; the spacers shrink to nothing instead. */
  #lobby, #name-prompt, #look-prompt, #host-menu {
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  #lobby::before, #lobby::after, #name-prompt::before, #name-prompt::after,
  #look-prompt::before, #look-prompt::after, #host-menu::before, #host-menu::after {
    content: "";
    flex: 1 0 0px;
  }
  #lobby-title { font-size: 28px; font-weight: 800; }
  #lobby-info { font-size: 16px; opacity: 0.75; }
  #lobby-count { font-size: 30vmin; font-weight: 800; line-height: 1; display: none; }
  #ready-btn {
    font: inherit;
    font-size: 26px;
    font-weight: 800;
    min-width: 60vw;
    padding: 22px 28px;
    border: 0;
    border-radius: 16px;
    color: var(--ink);
    /* Playtest 2026-09-27: yellow is the call to action, grey once pressed. */
    background: var(--yellow);
  }
  #ready-btn.on { background: #59606e; }
  #target-row { font-size: 20px; display: flex; align-items: center; gap: 12px; }
  /* Issue #236: the team picker, shown only in a Teams lobby, and the line
     that says which team this phone is on. */
  #team-row { font-size: 20px; display: none; align-items: center; gap: 10px; }
  #team-row.show { display: flex; }
  #team-row button {
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 12px;
    border: 2px solid #59606e;
    background: #1b1f29;
    color: #e8ecf4;
  }
  #team-row button.on { border-color: #e8ecf4; background: #2c3342; }
  #team-red { color: #f24545 !important; }
  #team-blue { color: #4d8cff !important; }
  #team-line { font-size: 22px; font-weight: 800; display: none; }
  #target-row button, #target-input {
    font: inherit;
    font-size: 24px;
    width: 64px;
    height: 52px;
    border-radius: 12px;
    border: 1px solid #59606e;
    background: #1b1f29;
    color: #e8ecf4;
    text-align: center;
  }
  /* Nickname prompt (issue #139): the first time a phone joins, before the
     pad or the Ready button, it picks a name. Above everything else, lobby
     included, so it gets every touch while it is up. Tapping the name later
     opens it again. */
  #name-prompt {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 18px;
    padding: 24px;
    background: var(--ground);
    text-align: center;
  }
  #name-prompt.show { display: flex; }
  #name-prompt-title { font-size: 26px; font-weight: 800; }
  #name-prompt-info { font-size: 15px; opacity: 0.7; }
  #name-input {
    font: inherit;
    font-size: 30px;
    font-weight: 700;
    width: 80vw;
    max-width: 420px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid #59606e;
    background: #1b1f29;
    color: #e8ecf4;
    text-align: center;
  }
  #name-row { display: flex; gap: 12px; }
  #name-shuffle, #name-go {
    font: inherit;
    font-size: 22px;
    font-weight: 800;
    padding: 18px 22px;
    border: 0;
    border-radius: 16px;
  }
  #name-shuffle { color: #e8ecf4; background: #2a303d; }
  #name-go { color: var(--ink); background: var(--yellow); min-width: 40vw; }
  /* Host controls (issue #149): a small gear, on the host's phone only, that
     opens a hidden menu. Tucked under the status line (HUD padding 12px +
     its 18px line = 30px, so 44px leaves a gap), clear of the lobby's
     buttons. Issue #231: a tap opens it, mid-round too -- it opens when the
     finger lifts on it, and a finger that slides off it or lands on it
     mid-drag is ignored, so a swing can never open it by accident. */
  #gear {
    position: fixed;
    z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 44px);
    right: 12px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 2px solid #59606e;
    border-radius: 50%;
    background: #1b1f29;
    color: #e8ecf4;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0.8;
  }
  #gear.show { display: flex; }
  #gear.pressed { border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(245, 226, 74, 0.45); }
  #gear svg { width: 24px; height: 24px; pointer-events: none; }
  #host-menu {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    padding: 24px;
    background: rgba(35, 42, 74, 0.97);
    text-align: center;
  }
  #host-menu.show { display: flex; }
  #host-menu-title { font-size: 26px; font-weight: 800; }
  .menu-view { display: none; flex-direction: column; align-items: center; gap: 14px; }
  .menu-view.show { display: flex; }
  #host-menu button {
    font: inherit;
    font-size: 22px;
    font-weight: 800;
    min-width: 64vw;
    padding: 16px 22px;
    border: 0;
    border-radius: 14px;
    color: #e8ecf4;
    background: #2a303d;
  }
  #host-menu button:disabled { opacity: 0.35; }
  /* Issue #352: the game-mode picker, one button per mode, the chosen one lit. */
  #menu-gamemodes { display: flex; flex-direction: column; gap: 8px; }
  #host-menu #menu-gamemodes button.on { color: var(--ink); background: var(--yellow); }
  #host-menu button.primary { color: var(--ink); background: var(--yellow); }
  #host-menu button.danger { color: #fff; background: #c62f3a; }
  #confirm-text { font-size: 22px; font-weight: 700; max-width: 80vw; }
  /* Hat and colour (issue #151): the second step of joining, straight after
     the nickname, and opened again from the lobby's "Hat & colour" button or
     by renaming. A full-screen card like the name prompt, never part of the
     pad a fight is played on. */
  #look-prompt {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    padding: 20px;
    background: var(--ground);
    text-align: center;
  }
  #look-prompt.show { display: flex; }
  #look-title { font-size: 26px; font-weight: 800; }
  .look-label { font-size: 15px; opacity: 0.7; }
  #hat-grid, #eyes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(92vw, 420px); }
  #hat-grid button, #eyes-grid button {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 4px 8px;
    border: 2px solid #2a303d;
    border-radius: 14px;
    background: #1b1f29;
    color: #e8ecf4;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  #hat-grid button.on, #eyes-grid button.on { border-color: var(--yellow); background: #2a303d; }
  #hat-grid canvas, #eyes-grid canvas { width: 72px; height: 56px; pointer-events: none; }
  #color-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: min(92vw, 420px); }
  #color-row button {
    position: relative;
    height: 52px;
    border: 3px solid transparent;
    border-radius: 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
  }
  #color-row button.on { border-color: #ffffff; box-shadow: 0 0 0 3px #0d0f14 inset; }
  /* A colour another player holds: dimmed, crossed out and not tappable. */
  #color-row button.taken {
    opacity: 0.3;
    background-image: linear-gradient(135deg, transparent 46%, #0d0f14 46%, #0d0f14 54%, transparent 54%) !important;
  }
  /* First-join tip (issue #291): a looping drag-to-swing animation over a
     full-screen card, shown once per device. Dismissed by the one button;
     the card takes touches only while it is up. */
  #tip {
    position: fixed;
    inset: 0;
    z-index: 11;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    background: rgba(35, 42, 74, 0.96);
    text-align: center;
  }
  #tip.show { display: flex; }
  #tip-text { font-size: 22px; font-weight: 700; max-width: 80vw; }
  #tip-art { width: min(70vw, 280px); height: auto; }
  /* Reduce flashes (issue #776): the host's setting or prefers-reduced-motion stops
     the looping tip animation; the buzz wash becomes a steady border (see buzz()). */
  body.calm #tip-pick, body.calm #tip-finger { animation: none; }
  #calmcue {
    position: fixed;
    inset: 0;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    box-shadow: inset 0 0 0 8px var(--calm, #fff);
  }
  #tip-pick { transform-origin: 140px 130px; animation: tip-swing 2.4s ease-in-out infinite; }
  #tip-finger { animation: tip-drag 2.4s ease-in-out infinite; }
  @keyframes tip-swing {
    0%, 15% { transform: rotate(-70deg); }
    55%, 75% { transform: rotate(40deg); }
    100% { transform: rotate(-70deg); }
  }
  @keyframes tip-drag {
    0%, 15% { transform: translate(-30px, 20px); opacity: 0.2; }
    25% { opacity: 1; }
    55%, 75% { transform: translate(40px, -10px); opacity: 1; }
    100% { transform: translate(-30px, 20px); opacity: 0.2; }
  }
  #tip-go {
    font: inherit;
    font-size: 22px;
    font-weight: 800;
    padding: 18px 22px;
    min-width: 50vw;
    border: 0;
    border-radius: 16px;
    color: var(--ink);
    background: var(--yellow);
  }
  #look-go {
    font: inherit;
    font-size: 22px;
    font-weight: 800;
    padding: 18px 22px;
    min-width: 50vw;
    border: 0;
    border-radius: 16px;
    color: var(--ink);
    background: var(--yellow);
  }
  #look-btn, #surprise-btn, #vibration-btn, #leave-btn {
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    padding: 12px 20px;
    border: 0;
    border-radius: 14px;
    color: #e8ecf4;
    background: #2a303d;
  }

  /* ---- #507 look (issue #576) ------------------------------------------------
     Chunky party style: indigo ground with faint stripes, cream panels, thick
     ink outlines and hard offset shadows, the player's own colour as the
     accent. Paint only: no rule here touches layout that the pad depends on,
     pointer-events or touch-action, and nothing animates per frame. Placed
     last so it wins over the structural rules above at equal specificity. */
  html, body { background-image: var(--stripes); }
  #lobby, #name-prompt, #look-prompt, #host-menu, #tip { background-image: var(--stripes); }
  #slot, #lobby-title, #name-prompt-title, #look-title, #host-menu-title, #state, #lobby-count, #confirm-text, #tip-text {
    font-family: var(--display);
    font-weight: 400;
    color: var(--cream);
  }
  #slot { color: var(--dim); text-shadow: 3px 3px 0 var(--ink); }
  #name { font-family: var(--display); font-weight: 400; text-decoration: none; text-shadow: 2px 2px 0 var(--ink); color: var(--dim); }
  #name:not(.locked) { text-decoration: underline dotted; text-underline-offset: 5px; text-decoration-thickness: 2px; }
  #status { color: var(--muted); opacity: 1; font-weight: 800; }
  #hint, .look-label, #name-prompt-info, #lobby-info { color: var(--muted); opacity: 1; font-weight: 800; }
  #hint { opacity: 0.75; }
  #lobby-title, #name-prompt-title, #look-title, #host-menu-title { font-size: 32px; text-shadow: 3px 3px 0 var(--ink); }
  #state { font-size: 32px; opacity: 1; text-shadow: 3px 3px 0 var(--ink); }
  #lobby-count { font-size: 30vmin; color: var(--yellow); text-shadow: 6px 6px 0 var(--ink); }
  #lives, #hill { font-family: var(--display); font-weight: 400; font-size: 24px; text-shadow: 2px 2px 0 var(--ink); }
  #dmgbar { background: rgba(20, 24, 29, 0.55); border-bottom: 1px solid var(--ink); }

  /* Every button: cream face, ink outline, hard shadow that the press eats. */
  #ready-btn, #look-btn, #surprise-btn, #vibration-btn, #leave-btn, #name-shuffle, #name-go, #look-go, #tip-go, #steal, #mouse-capture,
  #host-menu button, #team-row button, #target-row button, #hat-grid button, #eyes-grid button, #color-row button {
    font-family: var(--display);
    font-weight: 400;
    color: var(--ink);
    background: var(--cream);
    border: 4px solid var(--ink);
    border-radius: 16px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  #ready-btn:active, #look-btn:active, #surprise-btn:active, #vibration-btn:active, #leave-btn:active, #name-shuffle:active, #name-go:active, #look-go:active, #tip-go:active,
  #steal:active, #mouse-capture:active, #host-menu button:active, #team-row button:active, #target-row button:active,

    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  #ready-btn { font-size: 32px; border-width: 5px; border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); background: var(--yellow); }
  #ready-btn:active { box-shadow: 2px 2px 0 var(--ink); transform: translate(4px, 4px); }
  #ready-btn.on { background: var(--muted); }
  #name-go, #look-go, #tip-go, #steal, #mouse-capture, #host-menu button.primary { background: var(--yellow); }
  #host-menu button.danger { background: #D55E00; color: var(--ink); }
  #host-menu button:disabled { opacity: 0.45; box-shadow: 2px 2px 0 var(--ink); }
  #host-menu #menu-gamemodes button.on, #host-menu #menu-rules button.on { background: var(--yellow); color: var(--ink); }

  /* Host/team/target rows sit on a cream panel so their text reads on any phone. */
  #target-row, #team-row {
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
    color: var(--ink);
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 20px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 10px 14px;
  }
  #target-row button, #target-input { background: var(--yellow); font-size: 28px; line-height: 1; padding: 0; }
  #target-input {
    font-family: var(--display);
    font-weight: 400;
    background: #fff;
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 12px;
    box-shadow: inset 2px 2px 0 rgba(20, 24, 29, 0.18);
  }
  #team-row button { padding: 8px 14px; font-size: 22px; box-shadow: 3px 3px 0 var(--ink); }
  #team-row button.on { background: var(--yellow); }
  #team-red { background: #f24545 !important; color: var(--ink) !important; }
  #team-blue { background: #4d8cff !important; color: var(--ink) !important; }
  #team-row button:not(.on) { opacity: 0.6; }
  #team-row button.on { box-shadow: 0 0 0 3px var(--cream), 0 0 0 6px var(--ink), 4px 4px 0 6px var(--ink); }
  #team-line { font-family: var(--display); font-weight: 400; font-size: 24px; text-shadow: 2px 2px 0 var(--ink); }

  #look-btn, #surprise-btn, #vibration-btn, #leave-btn { font-size: 20px; }
  #name-input {
    font-family: var(--display);
    font-weight: 400;
    color: var(--ink);
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 18px;
    box-shadow: 5px 5px 0 var(--ink);
  }
  #name-shuffle, #name-go, #look-go, #tip-go { font-size: 26px; border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); }
  #host-menu button { font-size: 24px; border-radius: 18px; }

  /* The host gear: a small cream badge, ink-outlined. */
  #gear { background: var(--cream); color: var(--ink); border: 4px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); opacity: 1; }
  #gear.pressed { border-color: var(--ink); background: var(--yellow); box-shadow: 1px 1px 0 var(--ink); transform: translate(2px, 2px); }

  /* Hat, eyes and colour pickers. */
  #hat-grid button, #eyes-grid button { font-family: "Nunito", system-ui, sans-serif; font-weight: 900; font-size: 14px; border-width: 3px; border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); }
  #hat-grid button.on, #eyes-grid button.on { background: var(--yellow); border-color: var(--ink); }
  #hat-grid canvas, #eyes-grid canvas { background: var(--ground); border-radius: 10px; }
  #color-row button { border-width: 4px; border-radius: 16px; font-family: "Nunito", system-ui, sans-serif; font-weight: 900; }
  #color-row button.on { border-color: var(--cream); box-shadow: 0 0 0 4px var(--ink), 0 0 0 8px var(--cream); transform: scale(1.05); }
  #color-row button.taken { background-image: linear-gradient(135deg, transparent 46%, var(--ink) 46%, var(--ink) 54%, transparent 54%) !important; }

  #mouse-sens-row { color: var(--cream); opacity: 1; font-weight: 800; }
</style>

<canvas id="pad"></canvas>
<div id="flash"></div>
<div id="calmcue"></div>
<div id="dmgbar"><div id="dmgfill"></div></div>
<div id="lives"></div>
<div id="hill"></div>
<div id="modchip"></div>
<div id="weak-chip">Weak connection</div>
<button id="steal" type="button">Steal a life</button>
<div id="hud">

    <div id="slot">--</div>
    <div id="name"></div>
    <div id="career"></div>
  </div>
  <div id="status">connecting</div>
</div>
<div id="lobby">

  <div id="lobby-count"></div>
  <div id="lobby-info"></div>
  <div id="rules-summary"></div>
  <div id="target-row"><span id="target-label">First to</span>

    <input id="target-input" type="number" inputmode="numeric" min="1" max="99" value="5">

  <div id="team-line"></div>
  <div id="team-row">Team

    <button id="team-blue" type="button">Blue</button>
    <button id="team-auto" type="button">Auto</button>

  <button id="ready-btn" type="button">Ready</button>
  <button id="look-btn" type="button">Hat &amp; colour</button>
  <button id="surprise-btn" type="button">Surprise me</button>
  <button id="vibration-btn" type="button">Vibration: on</button>
  <label id="reach-row" for="reach">Swing reach
    <input id="reach" type="range" min="0.6" max="1.6" step="0.05" value="1">
    <span id="reach-value">1.00x</span>
  </label>
  <button id="leave-btn" type="button">Leave game</button>
</div>
<div id="name-prompt">

</div>

  <div id="eyes-grid"></div>
  <div class="look-label" id="color-label">Colour: first come, first served</div>
  <div id="color-row"></div>
  <button id="look-go" type="button">Done</button>
</div>
<div id="tip">

  var hintEl = document.getElementById("hint");

    var text = "";

        text = t("STATE_WAITING_SLOT");

        text = t("STATE_REASON_RECONNECTING", capitalise(closeReason));

    } else if (lobby && (lobby.phase === "playing" || lobby.phase === "round_end")) {

      if (lobby.phase === "round_end") {
        var left = Math.max(1, Math.ceil((nextRoundAt - Date.now()) / 1000));
        text = t("STATE_NEXT_ROUND_IN", left);
      } else if (!inRound) {
        text = t("STATE_WAITING_ROUND");
      } else if (!alive) {

  var CAREER_KEY = "pf_career";

  var CAREER_MAX_DELTA = 1000, CAREER_MAX_TOTAL = 999999, CAREER_MAX_WEAPONS = 40, CAREER_MAX_WEAPON_NAME = 24;

  function careerCount(v, cap) {

  }
  // A clean copy of raw: known fields only, whole non-negative capped numbers.
  function cleanCareer(raw, cap) {
    var out = { weapons: {} };
    var src = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
    for (var i = 0; i < CAREER_FIELDS.length; i++) { out[CAREER_FIELDS[i]] = careerCount(src[CAREER_FIELDS[i]], cap); }
    var w = src.weapons && typeof src.weapons === "object" && !Array.isArray(src.weapons) ? src.weapons : {};
    var names = Object.keys(w);
    for (var j = 0; j < names.length && Object.keys(out.weapons).length < CAREER_MAX_WEAPONS; j++) {
      var n = careerCount(w[names[j]], cap);

    var names = Object.keys(d.weapons);
    for (var j = 0; j < names.length; j++) {

        career.weapons[names[j]] = Math.min(CAREER_MAX_TOTAL, (career.weapons[names[j]] || 0) + d.weapons[names[j]]);

  var lobbyTitleEl = document.getElementById("lobby-title");

    c.fillStyle = HAT_OUTLINE;
    if (id === "visor") { c.fillRect(-27, -10.5, 54, 11); }
    [-9, 9].forEach(function (x) {
      var y = -5, reach = id === "wide" ? 3 : (id === "visor" ? 3 : 2.5);
      function disc(cx, cy, r, col) { c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
      if (id === "dot") { disc(x + 2, y, 4, HAT_OUTLINE); return; }
      if (id === "visor") { disc(x + reach, y, 2.5, "#fff"); return; }
      var r = id === "wide" ? 8 : 6;
      disc(x, y, r, "#fff");
      if (id === "wide") { c.strokeStyle = HAT_OUTLINE; c.lineWidth = 1.5; c.stroke(); }
      disc(x + reach, y, id === "wide" ? 2.5 : 3, HAT_OUTLINE);
      if (id === "sleepy") { c.beginPath(); c.arc(x, y, 6.5, Math.PI, 0); c.closePath(); c.fillStyle = HAT_OUTLINE; c.fill(); }
      if (id === "angry") {
        var d = x < 0 ? 1 : -1;
        c.beginPath(); c.moveTo(x - d * 8, y - 9); c.lineTo(x + d * 7, y - 4);
        c.strokeStyle = HAT_OUTLINE; c.lineWidth = 3; c.stroke();
      }
    });
  }

  // One picker grid (hats, eyes): a button per item with its preview and
  // label. A tap stores the pick under `key`, sends it as a `kind` frame
  // ("hat" or "eyes", also the look's field) and redraws the card.
  function buildPicker(gridEl, items, current, prefix, draw, tint, key, kind) {
    gridEl.textContent = "";
    items.forEach(function (item) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = item.id === current ? "on" : "";
      var preview = document.createElement("canvas");
      b.appendChild(preview);
      var label = document.createElement("span");
      label.textContent = tId(prefix, item.id, "", item.label);
      b.appendChild(label);
      draw(preview, item.id, tint);
      b.addEventListener("click", function () {
        store(key, item.id);
        sendText({ t: kind, v: item.id });
        var look = lookOf(slot);
        if (look) { look[kind] = item.id; }
        renderLookPrompt();
      });
      gridEl.appendChild(b);
    });
  }

  // The slot of another player holding palette colour k, or -1 when it is free.
  function colorHolder(k) {
    var holder = -1;
    for (var m = 0; looks && m < looks.looks.length; m++) {
      if (looks.looks[m].color === k && looks.looks[m].slot !== slot) { holder = looks.looks[m].slot; }
    }
    return holder;
  }

  function renderLookPrompt() {
    var mine = lookOf(slot) || { hat: stored(HAT_KEY) || "none", color: -1 };
    var tint = colorOf(slot);
    var hats = (looks && looks.hats) || [{ id: "none", label: "None" }];
    buildPicker(hatGridEl, hats, mine.hat, "HAT_", drawHat, tint, HAT_KEY, "hat");
    var myEyes = mine.eyes || stored(EYES_KEY) || "round";
    var styles = (looks && looks.eyes) || [{ id: "round", label: "Round" }];
    buildPicker(eyesGridEl, styles, myEyes, "EYES_", drawEyes, tint, EYES_KEY, "eyes");
    colorRowEl.textContent = "";
    var palette = (looks && looks.palette) || [];
    document.getElementById("color-label").style.display = palette.length ? "" : "none";
    for (var k = 0; k < palette.length; k++) {
      if (!palette[k]) { continue; }
      var holder = colorHolder(k);
      var sw = document.createElement("button");
      sw.type = "button";
      sw.style.background = palette[k];
      sw.className = holder >= 0 ? "taken" : (k === mine.color ? "on" : "");
      sw.disabled = holder >= 0;
      sw.setAttribute("aria-label", holder >= 0 ? t("COLOUR_TAKEN_BY", slotName(holder)) : (k === mine.color ? t("COLOUR_YOURS") : t("COLOUR_FREE")));
      sw.textContent = k === mine.color ? t("COLOUR_YOU") : "";
      sw.addEventListener("click", (function (index) {
        return function () {
          store(COLOR_KEY, String(index));
          sendText({ t: "color", v: index });
        };
      })(k));
      colorRowEl.appendChild(sw);
    }
  }

  // "Surprise me": a random hat, eyes and a colour no one else holds, sent as
  // the same hat, eyes and color frames the pickers send (issue #865). It
  // mirrors CosmeticsPicker.random_pick on the host side.
  function surpriseMe() {
    if (!looks || !looks.hats || !looks.eyes) { return; }
    var mine = lookOf(slot);
    var pick = function (list) { return list[Math.floor(Math.random() * list.length)]; };
    var hat = pick(looks.hats).id;
    var eyes = pick(looks.eyes).id;
    var free = [];
    var palette = looks.palette || [];
    for (var k = 0; k < palette.length; k++) {
      if (palette[k] && colorHolder(k) < 0) { free.push(k); }
    }
    store(HAT_KEY, hat);
    sendText({ t: "hat", v: hat });
    store(EYES_KEY, eyes);
    sendText({ t: "eyes", v: eyes });
    if (free.length) {
      var color = pick(free);
      store(COLOR_KEY, String(color));
      sendText({ t: "color", v: color });
    }
    if (mine) { mine.hat = hat; mine.eyes = eyes; }
    if (lookEl.classList.contains("show")) { renderLookPrompt(); }
  }

  document.getElementById("look-go").addEventListener("click", closeLookPrompt);
  document.getElementById("look-btn").addEventListener("click", openLookPrompt);
  document.getElementById("surprise-btn").addEventListener("click", surpriseMe);

  // ---- vibration switch (issue #749) ---------------------------------------------
  // Hidden where the browser cannot vibrate at all (iOS Safari): the flash is the only buzz there.
  var vibrationBtn = document.getElementById("vibration-btn");
  function showVibration() {
    vibrationBtn.textContent = t(vibrationOn ? "PHONE_VIBRATION_ON" : "PHONE_VIBRATION_OFF");
    vibrationBtn.setAttribute("aria-pressed", vibrationOn ? "true" : "false");
  }
  if (typeof navigator.vibrate !== "function") { vibrationBtn.style.display = "none"; }
  vibrationBtn.addEventListener("click", function () {
    vibrationOn = !vibrationOn;
    store(VIBRATION_KEY, vibrationOn ? "1" : "0");
    showVibration();
  });
  showVibration();

  // ---- swing reach slider (issue #817) -------------------------------------------
  // Touch phones only: a fine pointer has the mouse sensitivity row instead.
  var reachEl = document.getElementById("reach");
  var reachValueEl = document.getElementById("reach-value");
  function applyReach(v) {
    reachScale = v;
    dragRadiusPx = computeDragRadius();
    recompute();
  }
  if (finePointer) { document.getElementById("reach-row").style.display = "none"; }
  bindSlider(reachEl, reachValueEl, REACH_KEY, REACH_MIN, REACH_MAX, applyReach);

  // ---- leave game (issue #775) ---------------------------------------------------
  // Two taps: the first arms the button for a few seconds, the second tells the host to free the seat.
  var leaveBtn = document.getElementById("leave-btn");
  var leaveArmed = false;
  var leaveTimer = null;
  function showLeave() { leaveBtn.textContent = t(leaveArmed ? "PHONE_LEAVE_CONFIRM" : "PHONE_LEAVE"); }
  leaveBtn.addEventListener("click", function () {
    if (!leaveArmed) {
      leaveArmed = true;
      showLeave();
      leaveTimer = setTimeout(function () { leaveArmed = false; showLeave(); }, 4000);
      return;
    }
    clearTimeout(leaveTimer);
    leaveArmed = false;
    showLeave();
    sendText({ t: "leave" });
  });
  stateEl.addEventListener("click", function () {
    if (!leftOut) { return; }
    leftOut = false;
    showState();
    connect();
  });
  showLeave();

  // ---- host controls (issue #149) -------------------------------------------
  // Only the host phone -- the one allowed to set "first to N" -- gets the
  // gear; the host decides, and ignores the same requests from anyone else.
  // Pause/Resume is one tap inside the menu; End match and Kick player each
  // ask "Are you sure?" first. Issue #164: that question is about one match
  // and one player -- the kick carries the target's claim serial and End match
  // the match serial, both off the lobby state, so the host can refuse a stale
  // one, and a confirm is taken down as soon as its subject is gone.
  var gearEl = document.getElementById("gear");
  var menuEl = document.getElementById("host-menu");
  var menuPauseBtn = document.getElementById("menu-pause");
  var menuEndBtn = document.getElementById("menu-end");
  var menuKickBtn = document.getElementById("menu-kick");
  // Issue #236: Free-for-all or Teams, only between matches.
  var menuModeBtn = document.getElementById("menu-mode");
  // Stock lobby controls (issue #354), shown only while the lobby carries lobby.stock.
  var menuStockLivesBtn = document.getElementById("menu-stock-lives");
  var menuStockTimeBtn = document.getElementById("menu-stock-time");
  var STOCK_TIMES = [120, 300, 480, 900, 0];
  // Issue #239: Go online, only between matches. The host says where it is
  // in lobby.online ("off", "connecting", "online" or "unreachable") and
  // lobby.room.
  var menuOnlineBtn = document.getElementById("menu-online");
  var kickListEl = document.getElementById("menu-kick-list");
  var confirmTextEl = document.getElementById("confirm-text");
  var confirmAction = null;
  // While a confirm is up: a function that says whether it still applies.
  var confirmValid = null;
  // The roster the kick list was drawn from, to redraw it when that changes.
  var kickListKey = "";
  var gearPointer = null;

  function amHost() { return !!lobby && slot >= 0 && lobby.host === slot; }
  function inMatch() { return !!lobby && (lobby.phase === "playing" || lobby.phase === "round_end"); }
  function sendHost(cmd, extra) {
    var msg = { t: "host", cmd: cmd };
    if (extra) { for (var k in extra) { msg[k] = extra[k]; } }
    sendText(msg);
  }

  function showMenuView(id) {
    var views = menuEl.querySelectorAll(".menu-view");
    for (var i = 0; i < views.length; i++) { views[i].classList.toggle("show", views[i].id === id); }
  }
  function openHostMenu() {
    if (!amHost()) { return; }
    release(); // a drag in progress would otherwise stay held under the menu
    showMenuView("menu-main");
    menuEl.classList.add("show");
    refreshHostControls();
  }
  function closeHostMenu() {
    menuEl.classList.remove("show");
    confirmAction = null;
    confirmValid = null;
  }
  function askConfirm(text, action, valid) {
    confirmTextEl.textContent = text;
    confirmAction = action;
    confirmValid = valid || null;
    showMenuView("menu-confirm");
  }
  function viewShown(id) { return document.getElementById(id).classList.contains("show"); }
  // The lobby entry for `target` under claim `claim`, or null once that
  // player has gone (a new player in the same slot has a new claim).
  function claimHolder(target, claim) {
    var p = playerBySlot(target);
    return p && p.claim === claim ? p : null;
  }
  function rosterKey() {
    var key = "";
    for (var i = 0; lobby && i < lobby.players.length; i++) {
      var p = lobby.players[i];
      key += p.slot + ":" + p.claim + ":" + p.name + ";";
    }
    return key;
  }

  function refreshHostControls() {
    var host = amHost();
    gearEl.classList.toggle("show", host);
    if (!host) { closeHostMenu(); return; }
    var paused = !!lobby.paused;
    menuPauseBtn.textContent = paused ? t("PHONE_RESUME") : t("PHONE_PAUSE");
    menuPauseBtn.disabled = !inMatch();
    menuEndBtn.disabled = !inMatch();
    var others = 0;
    for (var i = 0; i < lobby.players.length; i++) { if (lobby.players[i].slot !== slot) { others++; } }
    menuKickBtn.disabled = others === 0;
    menuModeBtn.textContent = lobby.mode === "teams" ? t("PHONE_FORMAT_TEAMS") : t("PHONE_FORMAT_FFA");
    menuModeBtn.disabled = inMatch();
    refreshGameModes();
    refreshRulesSummary();
    if (viewShown("menu-rules")) { renderRules(); }
    var stock = lobby.stock;
    menuStockLivesBtn.hidden = menuStockTimeBtn.hidden = !stock;
    if (stock) {
      menuStockLivesBtn.textContent = t("MENU_LIVES", stock.lives);
      menuStockTimeBtn.textContent = stock.time > 0 ? t("MENU_TIME_MIN", stock.time / 60) : t("MENU_TIME_NONE");
      menuStockLivesBtn.disabled = menuStockTimeBtn.disabled = inMatch();
    }
    var online = lobby.online || "off";
    menuOnlineBtn.textContent = online === "off" ? t("PHONE_GO_ONLINE_OFF") :
      online === "connecting" ? t("MENU_ONLINE_CONNECTING") :
      online === "online" ? t("ONLINE_ROOM", lobby.room || "") : t("MENU_ONLINE_UNREACHABLE");
    menuOnlineBtn.disabled = inMatch();
    // Issue #435: a Couch (Local) match never goes online.
    menuOnlineBtn.hidden = lobby.kind === "local" || lobby.kind === "solo";
    // Issue #164: the lobby moved on under an open menu.
    if (viewShown("menu-confirm") && confirmValid && !confirmValid()) {
      confirmAction = null;
      confirmValid = null;
      showMenuView("menu-main");
    }
    if (viewShown("menu-kick-list") && rosterKey() !== kickListKey) { showKickList(); }
  }

  function showKickList() {
    kickListKey = rosterKey();
    kickListEl.textContent = "";
    for (var i = 0; i < lobby.players.length; i++) {
      var p = lobby.players[i];
      if (p.slot === slot) { continue; }
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = t("KICK_ROW", p.slot + 1, p.name);
      b.style.boxShadow = "inset 6px 0 0 " + colorOf(p.slot);
      b.addEventListener("click", (function (target, name, claim) {
        return function () {
          askConfirm(t("CONFIRM_KICK", name),
            function () { sendHost("kick", { slot: target, claim: claim }); },
            function () { return claimHolder(target, claim) !== null; });
        };
      })(p.slot, p.name, p.claim));
      kickListEl.appendChild(b);
    }
    var back = document.createElement("button");
    back.type = "button";
    back.textContent = t("PHONE_BACK");
    back.addEventListener("click", function () { showMenuView("menu-main"); });
    kickListEl.appendChild(back);
    showMenuView("menu-kick-list");
  }

  // Issue #231: a tap opens the menu, in the lobby and mid-round alike. Until
  // then a round needed the gear held for 700 ms, which on a phone read as the
  // gear doing nothing. It opens when the finger that pressed it lifts on it;
  // one that lifts off it, or lands while another finger is dragging, is
  // ignored, and none of it reaches the pad. touchstart's preventDefault keeps
  // iOS from scrolling or zooming, and also swallows the click, hence pointerup.
  function cancelGearPress() {
    gearPointer = null;
    gearEl.classList.remove("pressed");
  }
  gearEl.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (activePointer !== null || gearPointer !== null) { return; }
    gearPointer = e.pointerId;
    gearEl.classList.add("pressed");
  });
  gearEl.addEventListener("pointerup", function (e) {
    e.preventDefault();
    e.stopPropagation();
    // A touch is captured to the gear, so pointerleave never fires for a
    // finger that slides off: check where it lifted instead.
    var r = gearEl.getBoundingClientRect();
    var tapped = gearPointer !== null && e.pointerId === gearPointer &&
      e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    cancelGearPress();
    if (tapped) { openHostMenu(); }
  });
  gearEl.addEventListener("pointercancel", cancelGearPress);
  gearEl.addEventListener("pointerleave", cancelGearPress);
  gearEl.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });

  menuPauseBtn.addEventListener("click", function () {
    if (lobby && lobby.paused) { sendHost("resume"); closeHostMenu(); }
    else { sendHost("pause"); }
  });
  menuEndBtn.addEventListener("click", function () {
    var match = lobby.match;
    askConfirm(t("CONFIRM_END"),
      function () { sendHost("end", { match: match }); },
      function () { return inMatch() && lobby.match === match; });
  });
  menuKickBtn.addEventListener("click", showKickList);
  // Issue #352: the game-mode picker. The host lists the modes (lobby.game_modes,
  // from GameModes.TABLE) and which is chosen (lobby.game_mode, "" is Classic);
  // one the Teams format rules out is greyed out.
  var gameModesEl = document.getElementById("menu-gamemodes");
  var gameModesKey = "";
  function refreshGameModes() {
    var rows = lobby.game_modes || [];
    var key = JSON.stringify(rows);
    if (key !== gameModesKey) {
      gameModesKey = key;
      gameModesEl.innerHTML = "";
      rows.forEach(function (row) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.id = row.id;
        btn.textContent = tId("MODE_", row.id, "_NAME", row.name);
        btn.addEventListener("click", function () {
          if (inMatch() || btn.disabled) { return; }
          sendText({ t: "gamemode", v: row.id });
        });
        gameModesEl.appendChild(btn);
      });
    }
    var teams = lobby.mode === "teams";
    var chosen = lobby.game_mode || "";
    rows.forEach(function (row, i) {
      var btn = gameModesEl.children[i];
      btn.className = row.id === chosen ? "on" : "";
      btn.disabled = inMatch() || (teams && !!row.ffa_only) || (!teams && !!row.teams_only);
    });
  }
  menuModeBtn.addEventListener("click", function () {
    if (inMatch()) { return; }
    sendText({ t: "mode", v: lobby.mode === "teams" ? "ffa" : "teams" });
  });
  // Issue #647: the Stages & Rules page. The host lists each mode's stages
  // (lobby.stages_by_mode: {mode: {all, on}}) and the Rules (lobby.rules); a
  // tap sends stage_mode_toggle / stage_mode_all / modifier_toggle /
  // weapon_toggle. Names only: a phone shows no preview images.
  var RULES_MODES = ["classic", "king_of_the_hill", "sudden_death", "stock", "soccer", "capture_the_flag"];
  var rulesTab = "classic";
  var rulesTabsEl = document.getElementById("rules-tabs");
  var rulesStagesEl = document.getElementById("rules-stages");
  var rulesSwitchesEl = document.getElementById("rules-switches");
  var rulesWeaponsEl = document.getElementById("rules-weapons");
  var rulesFooterEl = document.getElementById("rules-footer");
  var rulesDoneBtn = document.getElementById("rules-done");
  var rulesSummaryEl = document.getElementById("rules-summary");
  var menuRulesSummaryEl = document.getElementById("menu-rules-summary");
  rulesWeaponsEl.style.cssText = "display:grid;grid-template-columns:repeat(2,1fr);gap:8px";
  function rulesModeName(id) { return t("MODE_" + id.toUpperCase() + "_NAME"); }
  function currentRulesMode() { return (lobby && lobby.game_mode) || "classic"; }
  function modeStages(mode) {
    var by = (lobby && lobby.stages_by_mode) || {};
    return by[mode] || { all: [], on: [] };
  }
  // "N stages on · modifiers on" for the mode the room is set to.
  function rulesSummaryText() {
    if (!lobby || !lobby.stages_by_mode || !lobby.rules) { return ""; }
    var mode = currentRulesMode();
    var rules = lobby.rules;
    var row = (rules.modes || {})[mode] || { on: [], locked: [] };
    var total = (rules.modifiers || []).length - (row.locked || []).length;
    var mods = row.on.length >= total ? (total === 0 ? t("RULES_MODS_OFF") : t("RULES_MODS_ON")) :
      (row.on.length === 0 ? t("RULES_MODS_OFF") : t("RULES_MODS_SOME", row.on.length, total));
    return t("RULES_SUMMARY", modeStages(mode).on.length, mods);
  }
  function rulesEditable() { return amHost() && lobby.phase !== "playing" && lobby.phase !== "round_end"; }
  // The first mode with stages to pick from but none on (the PC's empty_tabs()).
  function emptyRulesMode() {
    for (var i = 0; i < RULES_MODES.length; i++) {
      var s = modeStages(RULES_MODES[i]);
      if (s.all.length > 0 && s.on.length === 0) { return RULES_MODES[i]; }
    }
    return "";
  }
  function rulesFooterText(mode) {
    var st = modeStages(mode);
    var empty = emptyRulesMode();
    if (empty !== "") {
      return empty === mode ? t("RULES_FOOTER_NONE") : t("RULES_FOOTER_NONE_IN", rulesModeName(empty));
    }
    if (st.on.length === 0) { return t("RULES_FOOTER_NONE"); }
    if (mode === "stock") {
      return st.on.length === 1 ? t("RULES_FOOTER_STOCK_ONE", st.on[0]) : t("RULES_FOOTER_STOCK_MANY", st.on.length);
    }
    return t("RULES_FOOTER_DRAW", st.on.length, st.all.length);
  }
  function rulesButton(parent, label, on, locked, handler) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = label;
    btn.className = (on ? "on " : "") + (locked ? "locked" : "");
    btn.disabled = locked || !rulesEditable();
    btn.addEventListener("click", function () { if (rulesEditable()) { handler(); } });
    parent.appendChild(btn);
    return btn;
  }
  function renderRules() {
    if (!lobby || !lobby.stages_by_mode || !lobby.rules) { return; }
    var mode = rulesTab;
    var st = modeStages(mode);
    var rules = lobby.rules;
    var row = (rules.modes || {})[mode] || { on: [], locked: [] };
    var key = JSON.stringify([mode, st, rules, rulesEditable()]);
    if (key !== rulesFooterEl.dataset.key) {
      rulesFooterEl.dataset.key = key;
      rulesTabsEl.innerHTML = rulesStagesEl.innerHTML = rulesSwitchesEl.innerHTML = rulesWeaponsEl.innerHTML = "";
      RULES_MODES.forEach(function (id) {
        var tab = document.createElement("button");
        tab.type = "button";
        tab.textContent = rulesModeName(id);
        tab.className = id === mode ? "on" : "";
        tab.addEventListener("click", function () { rulesTab = id; renderRules(); });
        rulesTabsEl.appendChild(tab);
      });
      st.all.forEach(function (name) {
        var on = st.on.indexOf(name) !== -1;
        rulesButton(rulesStagesEl, name, on, false, function () {
          sendText({ t: "stage_mode_toggle", mode: mode, stage: name, on: !on });
        });
      });
      document.getElementById("rules-all-on").disabled = document.getElementById("rules-all-off").disabled = !rulesEditable();
      (rules.modifiers || []).forEach(function (id) {
        var locked = (row.locked || []).indexOf(id) !== -1;
        var on = !locked && row.on.indexOf(id) !== -1;
        var title = (rules.titles || {})[id] || id;
        rulesButton(rulesSwitchesEl, locked ? t("RULES_LOCKED", title) : title, on, locked, function () {
          sendText({ t: "modifier_toggle", mode: mode, id: id, on: !on });
        });
      });
      (rules.weapons || []).forEach(function (name) {
        var on = (rules.weapons_on || []).indexOf(name) !== -1;
        rulesButton(rulesWeaponsEl, name, on, false, function () {
          sendText({ t: "weapon_toggle", name: name, on: !on });
        });
      });
    }
    // The footer follows the tab, not the match's mode; Done waits for a stage.
    rulesFooterEl.textContent = rulesFooterText(mode);
    rulesDoneBtn.disabled = emptyRulesMode() !== "";
  }
  document.getElementById("menu-rules-open").addEventListener("click", function () {
    rulesTab = currentRulesMode();
    if (RULES_MODES.indexOf(rulesTab) === -1) { rulesTab = "classic"; }
    rulesFooterEl.dataset.key = "";
    showMenuView("menu-rules");
    renderRules();
  });
  document.getElementById("rules-all-on").addEventListener("click", function () {
    if (rulesEditable()) { sendText({ t: "stage_mode_all", mode: rulesTab, on: true }); }
  });
  document.getElementById("rules-all-off").addEventListener("click", function () {
    if (rulesEditable()) { sendText({ t: "stage_mode_all", mode: rulesTab, on: false }); }
  });
  rulesDoneBtn.addEventListener("click", function () { if (!rulesDoneBtn.disabled) { showMenuView("menu-main"); } });
  // The summary line: everyone sees it in the lobby; only the host gets the button.
  function refreshRulesSummary() {
    var text = rulesSummaryText();
    rulesSummaryEl.textContent = text;
    menuRulesSummaryEl.textContent = text;
  }
  menuStockLivesBtn.addEventListener("click", function () {
    if (inMatch() || !lobby.stock) { return; }
    sendText({ t: "stock", lives: lobby.stock.lives >= 10 ? 1 : lobby.stock.lives + 1 });
  });
  menuStockTimeBtn.addEventListener("click", function () {
    if (inMatch() || !lobby.stock) { return; }
    var i = STOCK_TIMES.indexOf(lobby.stock.time);
    sendText({ t: "stock", time: STOCK_TIMES[(i + 1) % STOCK_TIMES.length] });
  });
  menuOnlineBtn.addEventListener("click", function () {
    if (inMatch()) { return; }
    sendHost("online", { v: !(lobby.online && lobby.online !== "off") });
  });
  document.getElementById("menu-close").addEventListener("click", closeHostMenu);
  document.getElementById("confirm-yes").addEventListener("click", function () {
    var action = confirmAction;
    var valid = confirmValid;
    closeHostMenu();
    if (action && (!valid || valid())) { action(); }
  });
  document.getElementById("confirm-no").addEventListener("click", function () {
    confirmAction = null;
    confirmValid = null;
    showMenuView("menu-main");
  });

  // Must match ControllerServer.KICKED_REASON: a kicked phone stops retrying.
  var KICKED_REASON = "removed by the host";
  // Must match ControllerServer.LEFT_REASON (#775): this phone asked to leave.
  var LEFT_REASON = "left the game";
  // Must match ControllerServer.REPLACED_REASON (issue #164): this phone's id
  // connected again elsewhere, which now holds the slot. No retry either.
  var REPLACED_REASON = "opened somewhere else";
  // Must match the reason ControllerServer closes a phone with when every
  // slot is taken (issue #194): shown as "Waiting for a free slot".
  var NO_SLOT_REASON = "no free player slot";
  // Must match ControllerServer.REFUSED_CODE (#509): the host refused this
  // phone for the match kind (online, couch, solo, room closed). The fast
  // retry loop stops; a slow one (REFUSED_RETRY_MS) keeps going (#581).
  var REFUSED_CODE = 4003;

  function connect() {
    setStatus(t("STATUS_CONNECTING"));
    if (RELAY && !RELAY.ok) { setStatus(t("PHONE_RELAY_BAD_URL")); return; }
    // Every handler checks it still belongs to the current socket: a late
    // event from an old one must not undo the new one's state.
    var sock;
    try {
      sock = new WebSocket(RELAY ? RELAY.url : "ws://" + window.location.hostname + ":" + WS_PORT);
    } catch (err) {
      // A blocked or malformed URL (an insecure ws:// from an https page) throws
      // here: no close event follows, so say so and try again later.
      setStatus(t("STATUS_RETRYING", String((err && err.message) || err)));
      setTimeout(connect, REFUSED_RETRY_MS);
      return;
    }
    ws = sock;
    sock.binaryType = "arraybuffer";
    relayJoined = false;
    // Set by the relay's error or the host's "closed" notice: the socket's own
    // close event carries neither over the relay.
    var relayNote = null;
    sock.onopen = function () {
      if (sock !== ws) { return; }
      if (RELAY) {
        // Join the room; the hello follows the relay's welcome.
        sock.send(JSON.stringify({ t: "join", room: RELAY.room }));
        return;
      }
      // Identify ourselves before any binary input frame, so the host's
      // id-await stage (ControllerServer._process_websocket) has our id to
      // match before it ever needs to fall back to binding us as new.
      sock.send(JSON.stringify({ id: CLIENT_ID, client: "phone" }));
      setStatus(t("STATUS_CONNECTED"));
    };
    sock.onmessage = function (ev) {
      if (sock !== ws) { return; }
      if (!RELAY) {
        if (typeof ev.data === "string") { hostText(ev.data); }
        return;
      }
      if (typeof ev.data === "string") { relayText(ev.data); return; }
      var bytes = new Uint8Array(ev.data);
      if (bytes.length > 1 && bytes[0] === KIND_TEXT) { hostText(new TextDecoder().decode(bytes.subarray(1))); }
    };
    function hostText(text) {
      try {
        var msg = JSON.parse(text);
        if (typeof msg.slot === "number") {
          refusedOut = false;
          setSlot(msg.slot);
          sendName();
          announceLag();
          sendLook();
          if (!nameChosen()) { openNamePrompt(); }
          else if (!lookChosen()) { openLookPrompt(); }
          else { maybeShowTip(); }
        }
        else if (msg.t === "looks") { showLooks(msg); }
        else if (msg.t === "name") { showStoredName(msg.v); }
        else if (msg.t === "flash") { hostReduceFlash = msg.v === true; applyCalm(); }
        else if (msg.t === "buzz") { buzz(msg.kind); }
        else if (msg.t === "dmg") { showDamage(msg.v); }
        else if (msg.t === "lives") { showLives(msg); }
        else if (msg.t === "hill") { showHill(msg); }
        else if (msg.t === "mod") { showModifier(msg); }
        else if (msg.t === "ping") { sendText({ t: "pong", n: msg.n }); }
        else if (msg.t === "weak") { document.getElementById("weak-chip").classList.toggle("show", msg.v === true); }
        else if (msg.t === "career") { addCareer(msg.d); }
        else if (msg.t === "lobby") { showLobby(msg); }
        else if (msg.t === "closed" && RELAY) { relayNote = { code: Number(msg.code) || 0, reason: String(msg.reason || "") }; }
      } catch (err) { /* ignore anything that is not a known message */ }
    }
    // The relay's own text messages: welcome, or an error that ends the join.
    function relayText(text) {
      var msg;
      try { msg = JSON.parse(text); } catch (err) { return; }
      if (msg.t === "welcome") {
        relayJoined = true;
        xmit(KIND_TEXT, new TextEncoder().encode(JSON.stringify({ id: CLIENT_ID, client: "phone" })));
        setStatus(t("STATUS_CONNECTED"));
      } else if (msg.t === "error") {
        var friendly = { bad_room: "PHONE_RELAY_NO_ROOM", host_left: "PHONE_RELAY_HOST_LEFT",
          idle_timeout: "PHONE_RELAY_HOST_LEFT", room_full: "PHONE_RELAY_FULL" }[msg.reason];
        relayNote = { code: 0, reason: friendly ? t(friendly) : String(msg.reason || ""), relayError: true };
      }
    }
    // The host drops us for reasons a player needs to be told about: every
    // slot is taken (one phone more than the host has players), or our input
    // went quiet long enough to look like a locked screen. Show the server's
    // reason, then keep retrying -- a dropped controller must be able to
    // rejoin by itself once a slot frees up or the phone wakes. Not after a
    // kick, and not once this phone's id connected again somewhere else.
    // Over the relay the retry rejoins the room the same way (connect()).
    sock.onclose = function (ev) {
      if (sock !== ws) { return; }
      var code = ev ? ev.code : 0;
      var reason = (ev && ev.reason) ? String(ev.reason) : "";
      if (relayNote) { code = relayNote.code; reason = relayNote.reason; }
      var relayError = !!(relayNote && relayNote.relayError);
      relayJoined = false;
      var kicked = reason === KICKED_REASON;
      var left = reason === LEFT_REASON;
      var replaced = reason === REPLACED_REASON;
      var refused = code === REFUSED_CODE;
      closeReason = kicked || replaced ? "" : reason;
      if (relayError) { closeReason = ""; } // the relay's own error is the status line, not a host reason
      setStatus(kicked ? t("STATUS_KICKED") : (replaced ? t("STATUS_REPLACED") :
        (relayError ? reason : (refused ? reason : (reason ? t("STATUS_RETRYING", reason) : t("STATUS_RECONNECTING"))))));
      setSlot(-1);
      lobbyEl.className = "";
      lookEl.classList.remove("show");
      lobby = null;
      refreshHostControls();
      // Forget any drag that was in progress: the host has already zeroed this
      // player, and on reconnect the first frame should be "not touching".
      release();
      if (left) { leftOut = true; closeReason = ""; setStatus(t("STATUS_LEFT")); showState(); return; }
      if (kicked) { kickedOut = true; showState(); return; }
      if (replaced) { replacedOut = true; showState(); return; }
      if (refused) { refusedOut = true; showState(); setTimeout(connect, REFUSED_RETRY_MS); return; }
      if (relayError) { showState(); setTimeout(connect, REFUSED_RETRY_MS); return; }
      setTimeout(connect, RECONNECT_DELAY_MS);
    };
    sock.onerror = function () { /* onclose does the reconnecting */ };
  }

  // ---- render + send loop -------------------------------------------------
  // Whether the last frame drew anything: an idle pad skips clearing a canvas that is already clear.
  var drewLast = true;
  function draw() {
    var drawing = !!(anchor && point);
    if (drawing || drewLast) { ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
    drewLast = drawing;
    if (!drawing) { return; }
    var color = colorOf(slot);

    ctx.strokeStyle = color;
    ctx.fillStyle = color;

    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, dragRadiusPx, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(anchor.x, anchor.y);
    ctx.lineTo(anchor.x + vx * dragRadiusPx, anchor.y + vy * dragRadiusPx);
    ctx.stroke();

    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(anchor.x + vx * dragRadiusPx, anchor.y + vy * dragRadiusPx, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Stream continuously at display rate rather than on pointer events, so the
  // host always has the newest value and a dropped move event costs nothing.
  // One reused input packet per transport (send() copies the bytes): the bare
  // 8 bytes on the LAN, [KIND_INPUT][8 bytes] over the relay. Still sent every
  // frame, changed or not: the host expects a stream at display rate (ADR-0002).
  var inputBuf = new ArrayBuffer(8), inputView = new DataView(inputBuf);
  var relayInputBuf = new ArrayBuffer(9), relayInputView = new DataView(relayInputBuf);
  relayInputView.setUint8(0, KIND_INPUT);
  function frame() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      // Explicit little-endian, because that is what the wire format promises
      // and what the host's decode_float expects. A Float32Array would use
      // platform endianness, which happens to agree on every phone shipping
      // today but is not the contract.
      if (!RELAY) {
        inputView.setFloat32(0, vx, true);
        inputView.setFloat32(4, vy, true);
        ws.send(inputBuf);
      } else if (relayJoined) {
        relayInputView.setFloat32(1, vx, true);
        relayInputView.setFloat32(5, vy, true);
        ws.send(relayInputBuf);
      }
    }
    draw();
    window.requestAnimationFrame(frame);
  }

  // ---- screen wake lock ---------------------------------------------------
  // Best effort only. The Screen Wake Lock API is secure-context-only and this
  // page is served over plain HTTP from the host's LAN IP, so the request will
  // normally reject. That is an accepted prototype deviation from ADR-0002: no
  // HTTPS and no hidden-video hack here. Raise the phone's auto-lock timeout
  // instead.
  function requestWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request("screen").then(function (lock) {
          wakeLock = lock;
          // Issue #194: the browser drops the lock whenever the page is
          // hidden; forget it then so visibilitychange asks for a new one.
          lock.addEventListener("release", function () {
            if (wakeLock === lock) { wakeLock = null; }
          });
        }, function () { /* expected over plain HTTP */ });
      }
    } catch (err) { /* expected over plain HTTP */ }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !wakeLock) { requestWakeLock(); }
  });

  setSlot(-1);
  requestWakeLock();
  connect();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
