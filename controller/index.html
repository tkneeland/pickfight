<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pickfight Controller</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    background: #0d0f14;
    color: #e8ecf4;
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #pad {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    padding: 12px 16px;
    pointer-events: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  #slot {
    font-size: 15vmin;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #59606e;
  }
  #status {
    font-size: 14px;
    opacity: 0.7;
  }
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    text-align: center;
    font-size: 14px;
    opacity: 0.5;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="pad"></canvas>
<div id="hud">
  <div id="slot">--</div>
  <div id="status">connecting</div>
</div>
<div id="hint">Drag anywhere. Direction aims the weapon, distance sets its reach.</div>
<script>
(function () {
  "use strict";

  // ---- tunables -----------------------------------------------------------
  // ADR-0003 expects the drag radius to need feel-tuning. It is a fraction of
  // the short viewport edge so a full-reach drag means the same gesture on any
  // phone. The host re-reads this file per request, so tuning it needs no
  // host restart -- just reload the page.
  var DRAG_RADIUS_FRACTION = 0.35;
  var RECONNECT_DELAY_MS = 1000;
  // Must stay in sync with each Player's identity_color in scenes/Main.tscn:
  // slot 0 = Player1 blue, slot 1 = Player2 orange. The host paints that same
  // colour on Player1/Player2's persistent outline and weapon head (ADR-0005)
  // -- not the body fill, which reddens with damage -- so changing a colour
  // here means changing the matching identity_color there.
  var SLOT_COLORS = ["#2666ff", "#ff8c1a"];
  var NEUTRAL_COLOR = "#59606e";
  // Never let the drag radius reach zero: (point - anchor) / 0 is NaN, the
  // unit-disc clamp passes NaN through (NaN > 1 is false), and a NaN vector
  // on the wire is poison for the host's rigid body.
  var MIN_DRAG_RADIUS_PX = 1;

  var WS_PORT = __WS_PORT__;

  // ---- state --------------------------------------------------------------
  var dragRadiusPx = computeDragRadius();
  var anchor = null;   // CSS px, captured on pointerdown -- the drag is relative to this
  var point = null;     // CSS px, latest sample
  var vx = 0, vy = 0;   // unit-disc input vector, (0,0) means "not touching"
  var slot = -1;
  var ws = null;
  var wakeLock = null;

  var canvas = document.getElementById("pad");
  var ctx = canvas.getContext("2d");
  var slotEl = document.getElementById("slot");
  var statusEl = document.getElementById("status");

  // ---- geometry -----------------------------------------------------------
  function computeDragRadius() {
    var edge = Math.min(window.innerWidth, window.innerHeight);
    var radius = DRAG_RADIUS_FRACTION * edge;
    // A hidden/zero-sized viewport (background tab, some in-app browsers)
    // reports 0 here, which would divide the drag by zero.
    if (!isFinite(radius) || radius < MIN_DRAG_RADIUS_PX) { return MIN_DRAG_RADIUS_PX; }
    return radius;
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dragRadiusPx = computeDragRadius();
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  function clampToUnitDisc(x, y) {
    var len = Math.sqrt(x * x + y * y);
    if (len > 1) { return [x / len, y / len]; }
    return [x, y];
  }

  function recompute() {
    if (!anchor || !point) { vx = 0; vy = 0; return; }
    var v = clampToUnitDisc(
      (point.x - anchor.x) / dragRadiusPx,
      (point.y - anchor.y) / dragRadiusPx
    );
    vx = v[0];
    vy = v[1];
  }

  // ---- pointer input ------------------------------------------------------
  function begin(e) {
    anchor = { x: e.clientX, y: e.clientY };
    point = { x: e.clientX, y: e.clientY };
    recompute();
  }

  function move(e) {
    if (!anchor) { return; }
    // Coalesced events carry samples taken above display rate (ADR-0002); the
    // last one is the newest position, which is all the host cares about.
    var samples = (typeof e.getCoalescedEvents === "function") ? e.getCoalescedEvents() : null;
    var last = (samples && samples.length) ? samples[samples.length - 1] : e;
    point = { x: last.clientX, y: last.clientY };
    recompute();
  }

  function release() {
    anchor = null;
    point = null;
    vx = 0;
    vy = 0;
  }

  canvas.addEventListener("pointerdown", function (e) {
    canvas.setPointerCapture(e.pointerId);
    begin(e);
  });
  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  window.addEventListener("blur", release);

  // Touch listeners exist only to stop scroll, pull-to-refresh and pinch-zoom
  // from fighting the drag; the vector itself comes from the pointer events.
  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  // ---- transport ----------------------------------------------------------
  function setStatus(text) { statusEl.textContent = text; }

  function setSlot(n) {
    slot = n;
    if (n < 0) {
      slotEl.textContent = "--";
      slotEl.style.color = NEUTRAL_COLOR;
    } else {
      slotEl.textContent = "P" + (n + 1);
      slotEl.style.color = SLOT_COLORS[n % SLOT_COLORS.length];
    }
  }

  function connect() {
    setStatus("connecting");
    ws = new WebSocket("ws://" + window.location.hostname + ":" + WS_PORT);
    ws.binaryType = "arraybuffer";
    ws.onopen = function () { setStatus("connected"); };
    ws.onmessage = function (ev) {
      if (typeof ev.data !== "string") { return; }
      try {
        var msg = JSON.parse(ev.data);
        if (typeof msg.slot === "number") { setSlot(msg.slot); }
      } catch (err) { /* ignore anything that is not the slot message */ }
    };
    // The host drops us for reasons a player needs to be told about: every
    // slot is taken (a third phone, or a stray second tab), or our input went
    // quiet long enough to look like a locked screen. Show the server's
    // reason, then keep retrying -- a dropped controller must be able to
    // rejoin by itself once a slot frees up or the phone wakes.
    ws.onclose = function (ev) {
      var reason = (ev && ev.reason) ? String(ev.reason) : "";
      setStatus(reason ? (reason + " — retrying") : "reconnecting");
      setSlot(-1);
      // Forget any drag that was in progress: the host has already zeroed this
      // player, and on reconnect the first frame should be "not touching".
      release();
      setTimeout(connect, RECONNECT_DELAY_MS);
    };
    ws.onerror = function () { /* onclose does the reconnecting */ };
  }

  // ---- render + send loop -------------------------------------------------
  function draw() {
    var w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    if (!anchor || !point) { return; }
    var color = (slot >= 0) ? SLOT_COLORS[slot % SLOT_COLORS.length] : NEUTRAL_COLOR;

    ctx.strokeStyle = color;
    ctx.fillStyle = color;

    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, dragRadiusPx, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(anchor.x, anchor.y);
    ctx.lineTo(anchor.x + vx * dragRadiusPx, anchor.y + vy * dragRadiusPx);
    ctx.stroke();

    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(anchor.x + vx * dragRadiusPx, anchor.y + vy * dragRadiusPx, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Stream continuously at display rate rather than on pointer events, so the
  // host always has the newest value and a dropped move event costs nothing.
  function frame() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      // Explicit little-endian, because that is what the wire format promises
      // and what the host's decode_float expects. A Float32Array would use
      // platform endianness, which happens to agree on every phone shipping
      // today but is not the contract.
      var buf = new ArrayBuffer(8);
      var view = new DataView(buf);
      view.setFloat32(0, vx, true);
      view.setFloat32(4, vy, true);
      ws.send(buf);
    }
    draw();
    window.requestAnimationFrame(frame);
  }

  // ---- screen wake lock ---------------------------------------------------
  // Best effort only. The Screen Wake Lock API is secure-context-only and this
  // page is served over plain HTTP from the host's LAN IP, so the request will
  // normally reject. That is an accepted prototype deviation from ADR-0002: no
  // HTTPS and no hidden-video hack here. Raise the phone's auto-lock timeout
  // instead.
  function requestWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request("screen").then(function (lock) {
          wakeLock = lock;
        }, function () { /* expected over plain HTTP */ });
      }
    } catch (err) { /* expected over plain HTTP */ }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !wakeLock) { requestWakeLock(); }
  });

  setSlot(-1);
  requestWakeLock();
  connect();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
