<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pickfight Controller</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    background: #0d0f14;
    color: #e8ecf4;
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #pad {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    padding: 12px 16px;
    pointer-events: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  #slot {
    font-size: 15vmin;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #59606e;
  }
  #status {
    font-size: 14px;
    opacity: 0.7;
  }
  /* Nickname (issue #121): tap to edit. The only part of the HUD that takes
     touches. */
  #who { display: flex; flex-direction: column; }
  #name {
    pointer-events: auto;
    font-size: 22px;
    font-weight: 700;
    color: #59606e;
    text-decoration: underline dotted;
    text-underline-offset: 4px;
  }
  /* Where this player stands right now (issue #121): waiting, eliminated,
     next round in... Hidden while it is simply playing. */
  #state {
    position: fixed;
    left: 0;
    right: 0;
    top: 40%;
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    pointer-events: none;
    opacity: 0.9;
  }
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    text-align: center;
    font-size: 14px;
    opacity: 0.5;
    pointer-events: none;
  }
  /* The buzz flash (issue #34, ADR-0013): a full-screen wash in the slot's
     colour, faded out by buzz(). Behind the HUD, never in the way of a touch. */
  #flash {
    position: fixed;
    inset: 0;
    opacity: 0;
    pointer-events: none;
  }
  /* Lobby, countdown and victory (issue #120): covers the pad whenever no
     match is being played, so its buttons get the touches instead. */
  #lobby {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    background: rgba(13, 15, 20, 0.97);
    text-align: center;
  }
  #lobby.show { display: flex; }
  #lobby-title { font-size: 28px; font-weight: 800; }
  #lobby-info { font-size: 16px; opacity: 0.75; }
  #lobby-count { font-size: 30vmin; font-weight: 800; line-height: 1; display: none; }
  #ready-btn {
    font: inherit;
    font-size: 26px;
    font-weight: 800;
    min-width: 60vw;
    padding: 22px 28px;
    border: 0;
    border-radius: 16px;
    color: #0d0f14;
    background: #59606e;
  }
  #ready-btn.on { background: #ffd933; }
  #target-row { font-size: 20px; display: flex; align-items: center; gap: 12px; }
  #target-row button, #target-input {
    font: inherit;
    font-size: 24px;
    width: 64px;
    height: 52px;
    border-radius: 12px;
    border: 1px solid #59606e;
    background: #1b1f29;
    color: #e8ecf4;
    text-align: center;
  }
  /* Nickname prompt (issue #139): the first time a phone joins, before the
     pad or the Ready button, it picks a name. Above everything else, lobby
     included, so it gets every touch while it is up. Tapping the name later
     opens it again. */
  #name-prompt {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    background: #0d0f14;
    text-align: center;
  }
  #name-prompt.show { display: flex; }
  #name-prompt-title { font-size: 26px; font-weight: 800; }
  #name-prompt-info { font-size: 15px; opacity: 0.7; }
  #name-input {
    font: inherit;
    font-size: 30px;
    font-weight: 700;
    width: 80vw;
    max-width: 420px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid #59606e;
    background: #1b1f29;
    color: #e8ecf4;
    text-align: center;
  }
  #name-row { display: flex; gap: 12px; }
  #name-shuffle, #name-go {
    font: inherit;
    font-size: 22px;
    font-weight: 800;
    padding: 18px 22px;
    border: 0;
    border-radius: 16px;
  }
  #name-shuffle { color: #e8ecf4; background: #2a303d; }
  #name-go { color: #0d0f14; background: #ffd933; min-width: 40vw; }
  /* Host controls (issue #149): a small gear, on the host's phone only, that
     opens a hidden menu. Tucked under the status line, clear of the lobby's
     buttons. While a round is being played a tap does nothing: the gear has
     to be held for GEAR_HOLD_MS (it lights up), and a finger landing on it
     mid-drag is ignored, so a swing can never open it by accident. */
  #gear {
    position: fixed;
    z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 44px);
    right: 12px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 2px solid #59606e;
    border-radius: 50%;
    background: #1b1f29;
    color: #e8ecf4;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0.8;
  }
  #gear.show { display: flex; }
  #gear.holding { border-color: #ffd933; box-shadow: 0 0 0 4px rgba(255, 217, 51, 0.35); }
  #gear svg { width: 24px; height: 24px; pointer-events: none; }
  #host-menu {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    background: rgba(13, 15, 20, 0.97);
    text-align: center;
  }
  #host-menu.show { display: flex; }
  #host-menu-title { font-size: 26px; font-weight: 800; }
  .menu-view { display: none; flex-direction: column; align-items: center; gap: 14px; }
  .menu-view.show { display: flex; }
  #host-menu button {
    font: inherit;
    font-size: 22px;
    font-weight: 800;
    min-width: 64vw;
    padding: 16px 22px;
    border: 0;
    border-radius: 14px;
    color: #e8ecf4;
    background: #2a303d;
  }
  #host-menu button:disabled { opacity: 0.35; }
  #host-menu button.primary { color: #0d0f14; background: #ffd933; }
  #host-menu button.danger { color: #fff; background: #c62f3a; }
  #confirm-text { font-size: 22px; font-weight: 700; max-width: 80vw; }
</style>
</head>
<body>
<canvas id="pad"></canvas>
<div id="flash"></div>
<div id="hud">
  <div id="who">
    <div id="slot">--</div>
    <div id="name"></div>
  </div>
  <div id="status">connecting</div>
</div>
<div id="lobby">
  <div id="lobby-title">Lobby</div>
  <div id="lobby-count"></div>
  <div id="lobby-info"></div>
  <div id="target-row">First to
    <button id="target-down" type="button">-</button>
    <input id="target-input" type="number" inputmode="numeric" min="1" max="99" value="5">
    <button id="target-up" type="button">+</button>
  </div>
  <button id="ready-btn" type="button">Ready</button>
</div>
<div id="name-prompt">
  <div id="name-prompt-title">Pick your name</div>
  <input id="name-input" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
  <div id="name-prompt-info">Up to 12 letters. It shows above your fighter.</div>
  <div id="name-row">
    <button id="name-shuffle" type="button">Shuffle</button>
    <button id="name-go" type="button">Let's go</button>
  </div>
</div>
<button id="gear" type="button" aria-label="Host menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div id="host-menu">
  <div id="host-menu-title">Host menu</div>
  <div id="menu-main" class="menu-view">
    <button id="menu-pause" type="button" class="primary">Pause</button>
    <button id="menu-end" type="button" class="danger">End match</button>
    <button id="menu-kick" type="button">Kick player</button>
    <button id="menu-close" type="button">Close</button>
  </div>
  <div id="menu-kick-list" class="menu-view"></div>
  <div id="menu-confirm" class="menu-view">
    <div id="confirm-text"></div>
    <button id="confirm-yes" type="button" class="danger">Yes</button>
    <button id="confirm-no" type="button">No</button>
  </div>
</div>
<div id="state"></div>
<div id="hint">Drag to swing</div>
<script>
(function () {
  "use strict";

  // ---- tunables -----------------------------------------------------------
  // ADR-0003 expects the drag radius to need feel-tuning. It is a fraction of
  // the short viewport edge so a full-reach drag means the same gesture on any
  // phone. The host re-reads this file per request, so tuning it needs no
  // host restart -- just reload the page.
  var DRAG_RADIUS_FRACTION = 0.35;
  var RECONNECT_DELAY_MS = 1000;
  // Must stay in sync with each Player's identity_color in scenes/Main.tscn:
  // slot 0 = Player1 blue, slot 1 = Player2 orange, slot 2 = Player3 green,
  // slot 3 = Player4 magenta, slot 4 = Player5 yellow, slot 5 = Player6 cyan,
  // slot 6 = Player7 violet, slot 7 = Player8 red (issue #138). The host paints that same colour on each
  // player's persistent outline and weapon head (ADR-0005)
  // -- not the body fill, which reddens with damage -- so changing a colour
  // here means changing the matching identity_color there.
  var SLOT_COLORS = ["#2666ff", "#ff8c1a", "#1fd98c", "#ff52d1", "#ffdb1a", "#1ad1ff", "#9959ff", "#eb2933"];
  var NEUTRAL_COLOR = "#59606e";
  // Never let the drag radius reach zero: (point - anchor) / 0 is NaN, the
  // unit-disc clamp passes NaN through (NaN > 1 is false), and a NaN vector
  // on the wire is poison for the host's rigid body.
  var MIN_DRAG_RADIUS_PX = 1;
  // Buzzes the host sends (issue #34, ADR-0013), strongest first. `vibrate` is
  // a navigator.vibrate() pattern; `alpha` and `ms` are the flash's peak
  // opacity and fade length. The flash plays everywhere, not just where
  // vibrate is missing: it is the only buzz iOS Safari can give.
  var BUZZ = {
    win:        { rank: 4, vibrate: 400,           alpha: 0.85, ms: 700 },
    eliminated: { rank: 3, vibrate: [120, 80, 120], alpha: 0.6,  ms: 450 },
    struck:     { rank: 2, vibrate: 60,            alpha: 0.4,  ms: 220 },
    hit:        { rank: 1, vibrate: 25,            alpha: 0.18, ms: 120 }
  };

  var WS_PORT = __WS_PORT__;
  var NAME_KEY = "pickfight-name";
  // Set once this phone's player has picked a name in the prompt (issue
  // #139), so a reconnect or a later game goes straight to the controls.
  var NAME_CHOSEN_KEY = "pickfight-name-chosen";
  var MAX_NAME_LENGTH = 12;
  // Random fun default names (issue #121). Every pairing fits in
  // MAX_NAME_LENGTH, so no default is ever cut short.
  var NAME_ADJECTIVES = ["Crispy", "Zesty", "Soggy", "Mighty", "Sneaky", "Wobbly", "Fuzzy", "Salty",
    "Grumpy", "Spicy", "Rusty", "Jolly", "Turbo", "Lumpy", "Dizzy", "Sassy"];
  var NAME_NOUNS = ["Walrus", "Moose", "Badger", "Noodle", "Pickle", "Goose", "Yeti", "Otter",
    "Waffle", "Newt", "Llama", "Toast", "Gecko", "Ferret", "Bean", "Crab"];
  var CLIENT_ID_KEY = "pickfight-client-id";

  // ---- identity -------------------------------------------------------------
  // Persisted across reloads (and the reconnect that follows a screen lock or
  // a dropped socket) so the host can tell "this phone again" from "a new
  // phone" and hand back the same roster slot instead of whatever is free
  // (ADR-0007). localStorage survives a page reload; it does not survive the
  // user clearing site data or a different browser/tab claiming a fresh id,
  // both of which just look like a new phone to the host.
  function getClientId() {
    try {
      var id = localStorage.getItem(CLIENT_ID_KEY);
      if (!id) {
        id = (crypto && crypto.randomUUID) ? crypto.randomUUID() :
          "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        localStorage.setItem(CLIENT_ID_KEY, id);
      }
      return id;
    } catch (err) {
      // Private browsing / storage disabled: fall back to a per-load id. It
      // will not survive a reconnect, so this phone always binds as a fresh
      // roster entry instead of reclaiming -- a worse but working fallback.
      return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }
  }
  var CLIENT_ID = getClientId();

  function cleanName(raw) {
    return String(raw || "").replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0, MAX_NAME_LENGTH).trim();
  }
  function randomName() {
    for (;;) {
      var name = NAME_ADJECTIVES[Math.floor(Math.random() * NAME_ADJECTIVES.length)] + " " +
        NAME_NOUNS[Math.floor(Math.random() * NAME_NOUNS.length)];
      if (name.length <= MAX_NAME_LENGTH) { return name; }
    }
  }
  function loadName() {
    var name = "";
    try { name = cleanName(localStorage.getItem(NAME_KEY)); } catch (err) { /* private mode */ }
    if (!name) {
      name = randomName();
      try { localStorage.setItem(NAME_KEY, name); } catch (err) { /* kept for this load only */ }
    }
    return name;
  }
  var myName = loadName();

  // ---- state --------------------------------------------------------------
  var dragRadiusPx = computeDragRadius();
  var anchor = null;   // CSS px, captured on pointerdown -- the drag is relative to this
  var point = null;     // CSS px, latest sample
  var vx = 0, vy = 0;   // unit-disc input vector, (0,0) means "not touching"
  var slot = -1;
  var ws = null;
  var wakeLock = null;

  var canvas = document.getElementById("pad");
  var ctx = canvas.getContext("2d");
  var slotEl = document.getElementById("slot");
  var statusEl = document.getElementById("status");
  var nameEl = document.getElementById("name");
  var stateEl = document.getElementById("state");
  var flashEl = document.getElementById("flash");
  // The buzz still playing, so a weaker one arriving on its heels (the
  // `struck` right behind an `eliminated`, a `hit` right behind a `struck`)
  // does not cut it short -- vibrate() cancels whatever pattern was running.
  var buzzRank = 0, buzzUntil = 0;

  // ---- geometry -----------------------------------------------------------
  function computeDragRadius() {
    var edge = Math.min(window.innerWidth, window.innerHeight);
    var radius = DRAG_RADIUS_FRACTION * edge;
    // A hidden/zero-sized viewport (background tab, some in-app browsers)
    // reports 0 here, which would divide the drag by zero.
    if (!isFinite(radius) || radius < MIN_DRAG_RADIUS_PX) { return MIN_DRAG_RADIUS_PX; }
    return radius;
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dragRadiusPx = computeDragRadius();
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  function clampToUnitDisc(x, y) {
    var len = Math.sqrt(x * x + y * y);
    if (len > 1) { return [x / len, y / len]; }
    return [x, y];
  }

  function recompute() {
    if (!anchor || !point) { vx = 0; vy = 0; return; }
    var v = clampToUnitDisc(
      (point.x - anchor.x) / dragRadiusPx,
      (point.y - anchor.y) / dragRadiusPx
    );
    vx = v[0];
    vy = v[1];
  }

  // ---- pointer input ------------------------------------------------------
  // The one finger driving the drag. A second finger landing (a resting
  // thumb, a palm) is ignored until this one lifts, rather than re-anchoring
  // the drag or releasing it when the stray finger comes up.
  var activePointer = null;

  function begin(e) {
    activePointer = e.pointerId;
    anchor = { x: e.clientX, y: e.clientY };
    point = { x: e.clientX, y: e.clientY };
    recompute();
  }

  function move(e) {
    if (!anchor || e.pointerId !== activePointer) { return; }
    // Coalesced events carry samples taken above display rate (ADR-0002); the
    // last one is the newest position, which is all the host cares about.
    var samples = (typeof e.getCoalescedEvents === "function") ? e.getCoalescedEvents() : null;
    var last = (samples && samples.length) ? samples[samples.length - 1] : e;
    point = { x: last.clientX, y: last.clientY };
    recompute();
  }

  function release() {
    activePointer = null;
    anchor = null;
    point = null;
    vx = 0;
    vy = 0;
  }

  function releaseIfActive(e) {
    if (e.pointerId === activePointer) { release(); }
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (activePointer !== null) { return; }
    canvas.setPointerCapture(e.pointerId);
    begin(e);
  });
  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerup", releaseIfActive);
  canvas.addEventListener("pointercancel", releaseIfActive);
  window.addEventListener("blur", release);

  // Touch listeners exist only to stop scroll, pull-to-refresh and pinch-zoom
  // from fighting the drag; the vector itself comes from the pointer events.
  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  // ---- transport ----------------------------------------------------------
  function setStatus(text) { statusEl.textContent = text; }

  function setSlot(n) {
    slot = n;
    var color = n < 0 ? NEUTRAL_COLOR : SLOT_COLORS[n % SLOT_COLORS.length];
    slotEl.textContent = n < 0 ? "--" : "P" + (n + 1);
    slotEl.style.color = color;
    nameEl.style.color = color;
    nameEl.textContent = myName;
    document.body.style.boxShadow = n < 0 ? "none" : "inset 0 0 0 6px " + color;
    showState();
  }

  function sendName() { sendText({ t: "name", v: myName }); }

  // ---- nickname prompt (issue #139) -----------------------------------------
  var promptEl = document.getElementById("name-prompt");
  var nameInput = document.getElementById("name-input");
  nameInput.maxLength = MAX_NAME_LENGTH;

  function nameChosen() {
    try { return localStorage.getItem(NAME_CHOSEN_KEY) === "1"; } catch (err) { return false; }
  }

  // Up whenever the phone has joined but its player has never picked a name,
  // prefilled with the fun default so "Let's go" alone keeps it.
  function openNamePrompt() {
    nameInput.value = myName;
    promptEl.classList.add("show");
  }

  function commitName() {
    var name = cleanName(nameInput.value) || myName;
    myName = name;
    try {
      localStorage.setItem(NAME_KEY, name);
      localStorage.setItem(NAME_CHOSEN_KEY, "1");
    } catch (err) { /* kept for this load only */ }
    nameEl.textContent = name;
    promptEl.classList.remove("show");
    nameInput.blur();
    sendName();
  }

  document.getElementById("name-go").addEventListener("click", commitName);
  document.getElementById("name-shuffle").addEventListener("click", function () {
    nameInput.value = randomName();
  });
  nameInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { commitName(); }
  });
  nameEl.addEventListener("click", openNamePrompt);

  // ---- where this player stands (issue #121) --------------------------------
  // Read off the host's latest lobby state: waiting for a slot, waiting out a
  // round it joined too late for, eliminated, or counting down to the next.
  var nextRoundAt = 0;
  // Set once the host kicks this phone (issue #149): it stops reconnecting.
  var kickedOut = false;
  var stateTimer = null;
  function showState() {
    var text = "";
    if (kickedOut) {
      text = "The host removed you from the game";
    } else if (slot >= 0 && lobby && lobby.paused) {
      text = "Paused by the host";
    } else if (slot < 0) {
      text = statusEl.textContent === "connected" ? "Waiting for a free slot" : "";
    } else if (lobby && (lobby.phase === "playing" || lobby.phase === "round_end")) {
      var inRound = (lobby.in_round || []).indexOf(slot) !== -1;
      var alive = (lobby.alive || []).indexOf(slot) !== -1;
      if (lobby.phase === "round_end") {
        var left = Math.max(1, Math.ceil((nextRoundAt - Date.now()) / 1000));
        text = "Next round in " + left + "…";
      } else if (!inRound) {
        text = "Waiting for the next round";
      } else if (!alive) {
        text = "Eliminated — next round soon";
      }
    }
    stateEl.textContent = text;
    document.getElementById("hint").style.display = (lobby && lobby.phase === "playing" &&
      (lobby.alive || []).indexOf(slot) !== -1) || !lobby ? "" : "none";
  }

  function buzz(kind) {
    var b = BUZZ[kind];
    if (!b || slot < 0) { return; }
    var now = Date.now();
    if (now < buzzUntil && b.rank < buzzRank) { return; }
    buzzRank = b.rank;
    buzzUntil = now + b.ms;
    if (typeof navigator.vibrate === "function") {
      try { navigator.vibrate(b.vibrate); } catch (err) { /* flash still plays */ }
    }
    flashEl.style.background = SLOT_COLORS[slot % SLOT_COLORS.length];
    flashEl.style.transition = "none";
    flashEl.style.opacity = String(b.alpha);
    void flashEl.offsetWidth; // commit the peak before fading from it
    flashEl.style.transition = "opacity " + b.ms + "ms ease-out";
    flashEl.style.opacity = "0";
  }

  // ---- lobby (issue #120) ---------------------------------------------------
  // The host decides everything; this page only shows the latest state it
  // sent and asks for changes: Ready (Rematch on the victory screen) and, on
  // the host's phone, the match length.
  var lobbyEl = document.getElementById("lobby");
  var lobbyTitleEl = document.getElementById("lobby-title");
  var lobbyInfoEl = document.getElementById("lobby-info");
  var lobbyCountEl = document.getElementById("lobby-count");
  var targetRowEl = document.getElementById("target-row");
  var targetInput = document.getElementById("target-input");
  var readyBtn = document.getElementById("ready-btn");
  var lobby = null;
  var amReady = false;

  function sendText(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(obj)); }
  }

  function slotName(n) {
    if (lobby) {
      for (var i = 0; i < lobby.players.length; i++) {
        if (lobby.players[i].slot === n) { return lobby.players[i].name; }
      }
    }
    return "P" + (n + 1);
  }

  function showLobby(msg) {
    lobby = msg;
    var phase = msg.phase;
    if (phase === "round_end") { nextRoundAt = Date.now() + (msg.next || 0) * 1000; }
    if (stateTimer === null) { stateTimer = setInterval(showState, 250); }
    showState();
    refreshHostControls();
    if (phase === "playing" || phase === "round_end") { lobbyEl.className = ""; return; }
    // A drag in progress would otherwise stay held under the overlay.
    release();
    lobbyEl.className = "show";
    amReady = false;
    for (var i = 0; i < msg.players.length; i++) {
      if (msg.players[i].slot === slot) { amReady = !!msg.players[i].ready; }
    }
    var ready = 0;
    for (var j = 0; j < msg.players.length; j++) { if (msg.players[j].ready) { ready++; } }
    var isHost = slot >= 0 && msg.host === slot;
    lobbyCountEl.style.display = phase === "countdown" ? "block" : "none";
    lobbyCountEl.textContent = String(msg.count);
    targetRowEl.style.display = phase === "victory" ? "none" : "flex";
    targetInput.disabled = !isHost;
    document.getElementById("target-down").style.display = isHost ? "" : "none";
    document.getElementById("target-up").style.display = isHost ? "" : "none";
    if (document.activeElement !== targetInput) { targetInput.value = String(msg.target); }
    if (phase === "victory") {
      lobbyTitleEl.textContent = "Match over — " + (msg.winner === slot ? "you win!" :
        (msg.winner >= 0 ? slotName(msg.winner) + " wins" : "no winner"));
      readyBtn.textContent = amReady ? "Waiting for the others" : "Rematch";
    } else {
      lobbyTitleEl.textContent = phase === "countdown" ? "Get ready" :
        (amReady ? "Ready — waiting for the others" : "In the lobby") + (isHost ? " (you're host)" : "");
      readyBtn.textContent = amReady ? "Ready! (tap to cancel)" : "Ready";
    }
    readyBtn.className = amReady ? "on" : "";
    lobbyInfoEl.textContent = ready + " of " + msg.players.length + " ready" +
      (msg.players.length < 2 ? " (need 2 players)" : "");
  }

  function sendTarget(n) {
    n = Math.max(1, Math.min(99, Math.round(Number(n) || 1)));
    targetInput.value = String(n);
    sendText({ t: "target", n: n });
  }

  readyBtn.addEventListener("click", function () { sendText({ t: "ready", v: !amReady }); });
  targetInput.addEventListener("change", function () { sendTarget(targetInput.value); });
  document.getElementById("target-down").addEventListener("click", function () { sendTarget(Number(targetInput.value) - 1); });
  document.getElementById("target-up").addEventListener("click", function () { sendTarget(Number(targetInput.value) + 1); });

  // ---- host controls (issue #149) -------------------------------------------
  // Only the host phone -- the one allowed to set "first to N" -- gets the
  // gear; the host decides, and ignores the same requests from anyone else.
  // Pause/Resume is one tap inside the menu; End match and Kick player each
  // ask "Are you sure?" first.
  var GEAR_HOLD_MS = 700;
  var gearEl = document.getElementById("gear");
  var menuEl = document.getElementById("host-menu");
  var menuPauseBtn = document.getElementById("menu-pause");
  var menuEndBtn = document.getElementById("menu-end");
  var menuKickBtn = document.getElementById("menu-kick");
  var kickListEl = document.getElementById("menu-kick-list");
  var confirmTextEl = document.getElementById("confirm-text");
  var confirmAction = null;
  var gearHoldTimer = null;
  var gearPointer = null;

  function amHost() { return !!lobby && slot >= 0 && lobby.host === slot; }
  function inMatch() { return !!lobby && (lobby.phase === "playing" || lobby.phase === "round_end"); }
  function sendHost(cmd, extra) {
    var msg = { t: "host", cmd: cmd };
    if (extra) { for (var k in extra) { msg[k] = extra[k]; } }
    sendText(msg);
  }

  function showMenuView(id) {
    var views = menuEl.querySelectorAll(".menu-view");
    for (var i = 0; i < views.length; i++) { views[i].classList.toggle("show", views[i].id === id); }
  }
  function openHostMenu() {
    if (!amHost()) { return; }
    release(); // a drag in progress would otherwise stay held under the menu
    showMenuView("menu-main");
    menuEl.classList.add("show");
    refreshHostControls();
  }
  function closeHostMenu() {
    menuEl.classList.remove("show");
    confirmAction = null;
  }
  function askConfirm(text, action) {
    confirmTextEl.textContent = text;
    confirmAction = action;
    showMenuView("menu-confirm");
  }

  function refreshHostControls() {
    var host = amHost();
    gearEl.classList.toggle("show", host);
    if (!host) { closeHostMenu(); return; }
    var paused = !!lobby.paused;
    menuPauseBtn.textContent = paused ? "Resume" : "Pause";
    menuPauseBtn.disabled = !inMatch();
    menuEndBtn.disabled = !inMatch();
    var others = 0;
    for (var i = 0; i < lobby.players.length; i++) { if (lobby.players[i].slot !== slot) { others++; } }
    menuKickBtn.disabled = others === 0;
  }

  function showKickList() {
    kickListEl.textContent = "";
    for (var i = 0; i < lobby.players.length; i++) {
      var p = lobby.players[i];
      if (p.slot === slot) { continue; }
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = "P" + (p.slot + 1) + " " + p.name;
      b.style.boxShadow = "inset 6px 0 0 " + SLOT_COLORS[p.slot % SLOT_COLORS.length];
      b.addEventListener("click", (function (target, name) {
        return function () {
          askConfirm("Are you sure? Kick " + name + " out of the game?", function () { sendHost("kick", { slot: target }); });
        };
      })(p.slot, p.name));
      kickListEl.appendChild(b);
    }
    var back = document.createElement("button");
    back.type = "button";
    back.textContent = "Back";
    back.addEventListener("click", function () { showMenuView("menu-main"); });
    kickListEl.appendChild(back);
    showMenuView("menu-kick-list");
  }

  // A tap opens the gear outside play; during play it must be held, and a
  // finger that lands on it while another is dragging is ignored.
  function cancelGearHold() {
    if (gearHoldTimer !== null) { clearTimeout(gearHoldTimer); gearHoldTimer = null; }
    gearPointer = null;
    gearEl.classList.remove("holding");
  }
  gearEl.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (activePointer !== null || gearPointer !== null) { return; }
    if (!(inMatch() && !lobby.paused)) { openHostMenu(); return; }
    gearPointer = e.pointerId;
    gearEl.classList.add("holding");
    gearHoldTimer = setTimeout(function () { cancelGearHold(); openHostMenu(); }, GEAR_HOLD_MS);
  });
  gearEl.addEventListener("pointerup", cancelGearHold);
  gearEl.addEventListener("pointercancel", cancelGearHold);
  gearEl.addEventListener("pointerleave", cancelGearHold);
  gearEl.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });

  menuPauseBtn.addEventListener("click", function () {
    if (lobby && lobby.paused) { sendHost("resume"); closeHostMenu(); }
    else { sendHost("pause"); }
  });
  menuEndBtn.addEventListener("click", function () {
    askConfirm("Are you sure? End the match for everyone?", function () { sendHost("end"); });
  });
  menuKickBtn.addEventListener("click", showKickList);
  document.getElementById("menu-close").addEventListener("click", closeHostMenu);
  document.getElementById("confirm-yes").addEventListener("click", function () {
    var action = confirmAction;
    closeHostMenu();
    if (action) { action(); }
  });
  document.getElementById("confirm-no").addEventListener("click", function () {
    confirmAction = null;
    showMenuView("menu-main");
  });

  // Must match ControllerServer.KICKED_REASON: a kicked phone stops retrying.
  var KICKED_REASON = "removed by the host";

  function connect() {
    setStatus("connecting");
    ws = new WebSocket("ws://" + window.location.hostname + ":" + WS_PORT);
    ws.binaryType = "arraybuffer";
    ws.onopen = function () {
      // Identify ourselves before any binary input frame, so the host's
      // id-await stage (ControllerServer._process_websocket) has our id to
      // match before it ever needs to fall back to binding us as new.
      ws.send(JSON.stringify({ id: CLIENT_ID }));
      setStatus("connected");
    };
    ws.onmessage = function (ev) {
      if (typeof ev.data !== "string") { return; }
      try {
        var msg = JSON.parse(ev.data);
        if (typeof msg.slot === "number") {
          setSlot(msg.slot);
          sendName();
          if (!nameChosen()) { openNamePrompt(); }
        }
        else if (msg.t === "buzz") { buzz(msg.kind); }
        else if (msg.t === "lobby") { showLobby(msg); }
      } catch (err) { /* ignore anything that is not a known message */ }
    };
    // The host drops us for reasons a player needs to be told about: every
    // slot is taken (a fifth phone, or a stray extra tab), or our input went
    // quiet long enough to look like a locked screen. Show the server's
    // reason, then keep retrying -- a dropped controller must be able to
    // rejoin by itself once a slot frees up or the phone wakes.
    ws.onclose = function (ev) {
      var reason = (ev && ev.reason) ? String(ev.reason) : "";
      var kicked = reason === KICKED_REASON;
      setStatus(kicked ? "Removed by the host" : (reason ? (reason + " — retrying") : "reconnecting"));
      setSlot(-1);
      lobbyEl.className = "";
      lobby = null;
      refreshHostControls();
      // Forget any drag that was in progress: the host has already zeroed this
      // player, and on reconnect the first frame should be "not touching".
      release();
      if (kicked) { kickedOut = true; showState(); return; }
      setTimeout(connect, RECONNECT_DELAY_MS);
    };
    ws.onerror = function () { /* onclose does the reconnecting */ };
  }

  // ---- render + send loop -------------------------------------------------
  function draw() {
    var w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    if (!anchor || !point) { return; }
    var color = (slot >= 0) ? SLOT_COLORS[slot % SLOT_COLORS.length] : NEUTRAL_COLOR;

    ctx.strokeStyle = color;
    ctx.fillStyle = color;

    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, dragRadiusPx, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(anchor.x, anchor.y);
    ctx.lineTo(anchor.x + vx * dragRadiusPx, anchor.y + vy * dragRadiusPx);
    ctx.stroke();

    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(anchor.x + vx * dragRadiusPx, anchor.y + vy * dragRadiusPx, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Stream continuously at display rate rather than on pointer events, so the
  // host always has the newest value and a dropped move event costs nothing.
  function frame() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      // Explicit little-endian, because that is what the wire format promises
      // and what the host's decode_float expects. A Float32Array would use
      // platform endianness, which happens to agree on every phone shipping
      // today but is not the contract.
      var buf = new ArrayBuffer(8);
      var view = new DataView(buf);
      view.setFloat32(0, vx, true);
      view.setFloat32(4, vy, true);
      ws.send(buf);
    }
    draw();
    window.requestAnimationFrame(frame);
  }

  // ---- screen wake lock ---------------------------------------------------
  // Best effort only. The Screen Wake Lock API is secure-context-only and this
  // page is served over plain HTTP from the host's LAN IP, so the request will
  // normally reject. That is an accepted prototype deviation from ADR-0002: no
  // HTTPS and no hidden-video hack here. Raise the phone's auto-lock timeout
  // instead.
  function requestWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request("screen").then(function (lock) {
          wakeLock = lock;
        }, function () { /* expected over plain HTTP */ });
      }
    } catch (err) { /* expected over plain HTTP */ }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !wakeLock) { requestWakeLock(); }
  });

  setSlot(-1);
  requestWakeLock();
  connect();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
